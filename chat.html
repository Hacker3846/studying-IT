<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Мессенджер</title>
<script>
  (function() {
    var saved = localStorage.getItem("theme");
    if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
  })();
</script>

<style>
  :root {
    --ink: #eceae4;
    --paper: #15161a;
    --card: #1e2025;
    --accent: #5c7cfa;
    --accent-dark: #7c96ff;
    --line: #2f3138;
    --muted: #85848c;
    --bubble-me: #3454d1;
    --bubble-them: #262930;
  }

  html[data-theme="light"] {
    --ink: #1a1d1f;
    --paper: #f6f4ef;
    --card: #ffffff;
    --accent: #3454d1;
    --accent-dark: #2540a8;
    --line: #e2ded3;
    --muted: #8a8578;
    --bubble-me: #3454d1;
    --bubble-them: #ffffff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ===== ФОНОВЫЙ ГРАДИЕНТ "СИНЕЕ ПЛАМЯ" =====
     Тот же фон, что на странице входа, но приглушённее (умеренная
     видимость — не должен мешать читать переписку). Показывается только
     в тёмной теме: в светлой отключается, чтобы не выбиваться на
     светлом фоне. Сайдбар, шапки, поле ввода и пузыри собеседника сделаны
     полупрозрачными, чтобы пламя было видно сквозь интерфейс. */
  .bg-fire {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.32;
  }

  html[data-theme="light"] .bg-fire { display: none; }

  .bg-fire::before {
    content: "";
    position: absolute;
    left: -15%;
    bottom: -55%;
    width: 130%;
    height: 125%;

    background:
      radial-gradient(ellipse at 12% 82%,
        rgba(32, 78, 125, .95) 0%,
        rgba(27, 60, 98, .65) 20%,
        transparent 48%),
      radial-gradient(ellipse at 35% 70%,
        rgba(67, 108, 148, .82) 0%,
        rgba(37, 73, 108, .5) 23%,
        transparent 51%),
      radial-gradient(ellipse at 55% 78%,
        rgba(42, 91, 145, .95) 0%,
        rgba(27, 61, 99, .58) 24%,
        transparent 51%),
      radial-gradient(ellipse at 77% 68%,
        rgba(71, 111, 150, .78) 0%,
        rgba(32, 69, 105, .45) 22%,
        transparent 49%),
      radial-gradient(ellipse at 96% 82%,
        rgba(28, 72, 120, .9) 0%,
        rgba(22, 50, 82, .5) 25%,
        transparent 50%);

    filter: blur(30px);
    transform-origin: 50% 100%;
    animation: bgFlame 11s ease-in-out infinite alternate;
  }

  .bg-fire::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top,
        rgba(55, 91, 122, .16),
        transparent 42%),
      radial-gradient(ellipse at 50% 100%,
        rgba(42, 88, 135, .16),
        transparent 55%);
  }

  @keyframes bgFlame {
    0% { transform: translate3d(-3%, 2%, 0) scale(.98, .88); }
    30% { transform: translate3d(2%, -2%, 0) scale(1.03, 1.04); }
    65% { transform: translate3d(-2%, 1%, 0) scale(1.06, .96); }
    100% { transform: translate3d(4%, -4%, 0) scale(1.02, 1.08); }
  }

  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* ===== СПИСОК ЧАТОВ ===== */
  #sidebar {
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  html:not([data-theme="light"]) #sidebar { background: color-mix(in srgb, var(--card) 82%, transparent); }

  #sidebarHeader {
    padding: 16px 18px 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    gap: 8px;
  }

  #sidebarHeader .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .mark-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--accent);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .mark-text {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #meBtn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0;
    flex-shrink: 0;
  }

  #meBtn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #newChatBtn {
    margin: 12px 18px;
    padding: 10px 0;
    background: var(--paper);
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  #newChatBtn:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== ПОИСК ===== */
  .search-box {
    margin: 0 18px 10px 18px;
    position: relative;
  }

  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--muted);
    pointer-events: none;
  }

  .search-box input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 13.5px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-box input:focus { border-color: var(--accent); }

  .modal-list .search-box { margin: 0 0 12px 0; }

  #chatList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 12px 8px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 10px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 2px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .chat-item:hover { background: var(--paper); }
  .chat-item.active { background: #1c2540; }
  html[data-theme="light"] .chat-item.active { background: #eaf0fb; }

  /* Чат, заблокированный текущим пользователем (или наоборот — тем, кто
     заблокировал текущего пользователя, для личных чатов): выглядит
     приглушённо и всегда сортируется в конец списка, но не скрывается —
     чтобы его можно было явно разблокировать или удалить. */
  .chat-item.blocked {
    opacity: 0.5;
  }

  .chat-item.blocked .chat-name::after {
    content: " · заблокирован";
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
  }

  .chat-item.selected-for-action {
    background: #1c2540;
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  html[data-theme="light"] .chat-item.selected-for-action { background: #eaf0fb; }

  .chat-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    flex-shrink: 0;
    overflow: hidden;
  }

  .chat-avatar.global { background: var(--accent); color: white; }
  .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .chat-info { flex: 1; min-width: 0; }

  .chat-name {
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-preview {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .empty-hint {
    padding: 24px 18px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
  }

  /* ===== ОКНО ПЕРЕПИСКИ ===== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--paper);
    position: relative;
  }

  html:not([data-theme="light"]) #main { background: transparent; }

  #chatHeader {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    flex-shrink: 0;
  }

  html:not([data-theme="light"]) #chatHeader { background: color-mix(in srgb, var(--card) 82%, transparent); }

  #backBtn {
    display: none;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink);
    padding: 0 4px 0 0;
  }

  #chatHeaderName { font-weight: 700; font-size: 15.5px; }
  #chatHeaderSub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .msg-row {
    display: flex;
    width: 100%;
    margin-bottom: 4px;
  }

  .msg-sender {
    font-size: 11.5px;
    color: var(--accent);
    font-weight: 600;
    margin: 6px 4px 3px 4px;
  }

  .msg-row, .msg-row * {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .bubble {
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg-row.them .bubble {
    background: var(--bubble-them);
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  html:not([data-theme="light"]) .msg-row.them .bubble { background: color-mix(in srgb, var(--bubble-them) 85%, transparent); }
  html:not([data-theme="light"]) .msg-row.them .voice-bubble { background: color-mix(in srgb, var(--bubble-them) 85%, transparent); }

  .msg-time {
    font-size: 10.5px;
    color: var(--muted);
    margin: 3px 4px 0 4px;
  }

  /* ===== МЕДИА В СООБЩЕНИЯХ ===== */
  .bubble-media {
    padding: 0;
    overflow: hidden;
    background: transparent;
    border: none;
  }

  .bubble-image {
    max-width: 260px;
    max-height: 320px;
    display: block;
    border-radius: 16px;
    cursor: pointer;
  }

  .msg-row.me .bubble-image { border-bottom-right-radius: 4px; }
  .msg-row.them .bubble-image { border-bottom-left-radius: 4px; border: 1px solid var(--line); }

  .voice-bubble {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px 9px 10px;
    border-radius: 16px;
    min-width: 180px;
  }

  .msg-row.me .voice-bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .msg-row.them .voice-bubble { background: var(--bubble-them); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

  .voice-play-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.25);
    color: inherit;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .msg-row.them .voice-play-btn { background: var(--paper); }
  .voice-play-btn svg { width: 13px; height: 13px; }

  .voice-track {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    position: relative;
  }

  .msg-row.them .voice-track { background: var(--line); }

  .voice-track-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: currentColor;
    border-radius: 2px;
  }

  .voice-duration {
    font-size: 11px;
    opacity: 0.85;
    flex-shrink: 0;
    min-width: 30px;
  }

  .upload-progress {
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bubble-them);
    border: 1px solid var(--line);
  }

  .msg-row.me .upload-progress { border-bottom-right-radius: 4px; }
  .msg-row.them .upload-progress { border-bottom-left-radius: 4px; }

  /* ===== ДЕЙСТВИЯ НАД СООБЩЕНИЕМ (ответить / удалить) ===== */
  .msg-row {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .msg-row.me { justify-content: flex-end; }
  .msg-row.them { justify-content: flex-start; }

  .msg-bubble-wrap {
    position: relative;
  }

  /* ===== ВЫДЕЛЕНИЕ НЕСКОЛЬКИХ СООБЩЕНИЙ ===== */

  .msg-row-inner {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }

  .msg-row.me .msg-row-inner { align-items: flex-end; }
  .msg-row.them .msg-row-inner { align-items: flex-start; }

  .msg-select-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--card);
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
    cursor: pointer;
  }

  .selection-mode .msg-select-check { display: flex; }

  .msg-select-check svg {
    width: 12px;
    height: 12px;
    opacity: 0;
  }

  .msg-row.selected .msg-select-check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .msg-row.selected .msg-select-check svg { opacity: 1; }

  .selection-mode .msg-row.selected .msg-bubble-wrap {
    background: rgba(52,84,209,0.10);
    border-radius: 16px;
  }

  /* Раньше здесь стоял flex-direction: row-reverse на .msg-row.me — это
     ломало justify-content: flex-end (row-reverse разворачивает и то, что
     считается "концом" ряда), из-за чего свои сообщения в режиме выделения
     уезжали влево, к сообщениям собеседника. Чекбокс слева от своего пузыря
     теперь достигается через order, без изменения направления ряда. */
  .selection-mode .msg-row.me .msg-select-check { order: -1; }

  .selection-mode .msg-bubble-wrap { cursor: pointer; }

  /* Панель множественного выбора — лежит АБСОЛЮТНО поверх обычной шапки
     чата (в тех же границах), поэтому её появление/исчезновение не двигает
     и не сжимает список сообщений под ней. */
  #selectionBar {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
  }

  html:not([data-theme="light"]) #selectionBar { background: color-mix(in srgb, var(--card) 92%, transparent); }

  #selectionBar.show { display: flex; }

  #selectionBar .sel-close {
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    flex-shrink: 0;
  }

  #selectionBar .sel-count {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
  }

  #selectionBar .sel-action {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #selectionBar .sel-action:hover { background: var(--line); }
  #selectionBar .sel-action svg { width: 18px; height: 18px; }
  #selectionBar .sel-action.danger { color: var(--error, #c0392b); }

  /* ===== ПАНЕЛЬ ДЕЙСТВИЙ НАД ЧАТОМ (зажатие строки в списке чатов) =====
     Визуально и по разметке — та же плашка, что #selectionBar у сообщений,
     но лежит поверх шапки списка чатов (#sidebarHeader), а не поверх
     заголовка переписки. Действия: заблокировать / разблокировать /
     удалить чат. Набор кнопок собирается в JS под конкретный чат. */
  #chatActionBar {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
  }

  html:not([data-theme="light"]) #chatActionBar { background: color-mix(in srgb, var(--card) 92%, transparent); }

  #chatActionBar.show { display: flex; }

  #chatActionBar .sel-close {
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    flex-shrink: 0;
  }

  #chatActionBar .chat-action-name {
    flex: 1;
    font-size: 14.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .msg-action-menu {
    position: absolute;
    top: -34px;
    z-index: 5;
    display: none;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }

  .msg-row.me .msg-action-menu { right: 0; }
  .msg-row.them .msg-action-menu { left: 0; }

  .msg-action-menu.show { display: flex; }

  .msg-action-btn {
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }

  .msg-action-btn:hover { background: var(--paper); }
  .msg-action-btn.danger { color: var(--error, #c0392b); }

  /* Цитата ответа внутри пузыря сообщения */
  .msg-reply-quote {
    display: block;
    border-left: 3px solid rgba(255,255,255,0.5);
    padding: 3px 8px;
    margin-bottom: 6px;
    font-size: 12.5px;
    line-height: 1.3;
    border-radius: 4px;
    background: rgba(255,255,255,0.12);
    max-height: 40px;
    overflow: hidden;
  }

  .msg-row.them .msg-reply-quote {
    border-left-color: var(--accent);
    background: var(--paper);
  }

  .msg-reply-quote .reply-name {
    display: block;
    font-weight: 700;
    color: inherit;
    opacity: 0.9;
  }

  .msg-row.them .msg-reply-quote .reply-name { color: var(--accent); }

  .msg-reply-quote .reply-text {
    display: block;
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Плашка "отвечаю на..." над полем ввода */
  #replyPreview {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  #replyPreview.show { display: flex; }

  #replyPreview .reply-bar {
    width: 3px;
    align-self: stretch;
    background: var(--accent);
    border-radius: 2px;
    flex-shrink: 0;
  }

  #replyPreview .reply-info {
    flex: 1;
    min-width: 0;
  }

  #replyPreview .reply-info-name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
  }

  #replyPreview .reply-info-text {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #replyPreview .reply-cancel {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
  }

  #replyPreview .reply-cancel:hover { color: var(--ink); }
