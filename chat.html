  let recordingStartTime = null;
  let recordingTimerInterval = null;
  let isRecording = false;

  // ---------- АВТОРИЗАЦИЯ ----------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    currentUser = user;
    const snap = await getDoc(doc(db, "users", user.uid));
    currentUserData = snap.exists() ? snap.data() : { name: user.email };
    renderMeBtn();

    await ensureGlobalChatMembership(user.uid);
    await loadAllUsers();
    loadChatList();
  });

  // Подстраховка: если пользователя почему-то нет в members глобального чата
  // (например, профиль был создан до появления этой логики), добавляем его сюда же.
  async function ensureGlobalChatMembership(uid) {
    const globalChatRef = doc(db, "chats", "global");
    const globalChatSnap = await getDoc(globalChatRef);

    if (!globalChatSnap.exists()) {
      await setDoc(globalChatRef, {
        type: "global",
        name: "Общий чат",
        members: [uid],
        createdAt: serverTimestamp()
      });
    } else if (!(globalChatSnap.data().members || []).includes(uid)) {
      await updateDoc(globalChatRef, {
        members: arrayUnion(uid)
      });
    }
  }

  function renderMeBtn() {
    const btn = document.getElementById("meBtn");
    if (currentUserData.photoURL) {
      btn.innerHTML = `<img src="${currentUserData.photoURL}">`;
    } else {
      btn.textContent = initials(currentUserData.name);
    }
    btn.title = currentUserData.name + (currentUserData.group ? " · " + currentUserData.group : "");
  }

  window.handleLogout = function() {
    if (confirm("Выйти из аккаунта?")) {
      signOut(auth);
    }
  }

  // ---------- ТЕМА ----------
  // Тёмная тема — дефолт (нет атрибута data-theme на <html>).
  // Светлая включается явно через data-theme="light" и запоминается.
  window.toggleTheme = function() {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    setTheme(!isLight ? "light" : "dark");
  }

  function setTheme(mode) {
    if (mode === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    localStorage.setItem("theme", mode);
    const btn = document.getElementById("themeToggleBtn");
    const knob = document.getElementById("themeToggleKnob");
    const isDark = mode !== "light";
    if (btn) btn.classList.toggle("on", isDark);
    if (knob) knob.textContent = isDark ? "🌙" : "☀️";
  }

  function initThemeToggleUI() {
    const isDark = document.documentElement.getAttribute("data-theme") !== "light";
    const btn = document.getElementById("themeToggleBtn");
    const knob = document.getElementById("themeToggleKnob");
    if (btn) btn.classList.toggle("on", isDark);
    if (knob) knob.textContent = isDark ? "🌙" : "☀️";
  }

  // ---------- МОДАЛКА ПРОФИЛЯ ----------
  let pendingAvatarFile = null;
  let pendingAvatarPreviewUrl = null;

  window.openProfileModal = function() {
    pendingAvatarFile = null;
    if (pendingAvatarPreviewUrl) { URL.revokeObjectURL(pendingAvatarPreviewUrl); pendingAvatarPreviewUrl = null; }

    document.getElementById("profileNameInput").value = currentUserData.name || "";
    document.getElementById("profileGroupInput").value = currentUserData.group || "";
    setProfileAvatarPreview(currentUserData.photoURL, currentUserData.name);
    hideProfileMsg();
    initThemeToggleUI();

    const saveBtn = document.getElementById("profileSaveBtn");
    saveBtn.disabled = false;
    saveBtn.textContent = "Сохранить";

    document.getElementById("profileModal").classList.add("show");
  }

  window.closeProfileModal = function() {
    document.getElementById("profileModal").classList.remove("show");
    if (pendingAvatarPreviewUrl) { URL.revokeObjectURL(pendingAvatarPreviewUrl); pendingAvatarPreviewUrl = null; }
    pendingAvatarFile = null;
  }

  function setProfileAvatarPreview(url, name) {
    const el = document.getElementById("profileAvatarPreview");
    if (url) {
      el.innerHTML = `<img src="${url}">`;
    } else {
      el.textContent = initials(name);
    }
  }

  function showProfileMsg(text, type) {
    const box = document.getElementById("profileMsg");
    box.textContent = text;
    box.className = "profile-msg show " + type;
  }
  function hideProfileMsg() {
    document.getElementById("profileMsg").className = "profile-msg";
  }

  document.addEventListener("DOMContentLoaded", () => {
    const avatarInput = document.getElementById("avatarFileInput");
    if (avatarInput) {
      avatarInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          showProfileMsg("Можно загрузить только изображение.", "error");
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          showProfileMsg("Файл слишком большой (максимум 8 МБ).", "error");
          return;
        }

        if (pendingAvatarPreviewUrl) URL.revokeObjectURL(pendingAvatarPreviewUrl);
        pendingAvatarFile = file;
        pendingAvatarPreviewUrl = URL.createObjectURL(file);
        setProfileAvatarPreview(pendingAvatarPreviewUrl, "");
        hideProfileMsg();
      });
    }
  });

  window.saveProfile = async function() {
    const name = document.getElementById("profileNameInput").value.trim();
    const group = document.getElementById("profileGroupInput").value.trim();

    if (!name) {
      showProfileMsg("Введи имя.", "error");
      return;
    }

    const saveBtn = document.getElementById("profileSaveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Сохраняем…";
    hideProfileMsg();

    try {
      let photoURL = currentUserData.photoURL || null;

      if (pendingAvatarFile) {
        photoURL = await uploadToCloudinary(pendingAvatarFile, CLOUDINARY_IMAGE_URL);
      }

      const updates = { name, group, photoURL };
      await setDoc(doc(db, "users", currentUser.uid), updates, { merge: true });

      currentUserData = { ...currentUserData, ...updates };
      allUsers[currentUser.uid] = { ...allUsers[currentUser.uid], ...updates };

      renderMeBtn();
      closeProfileModal();

      // Обновляем список чатов и открытый чат, если в них показывалось имя/фото
      lastChats = await currentChatsSnapshotFallback();
      renderChatList(filterChats(lastChats));
    } catch (err) {
      showProfileMsg("Не удалось сохранить: " + err.message, "error");
      saveBtn.disabled = false;
      saveBtn.textContent = "Сохранить";
    }
  }

  function initials(name) {
    if (!name) return "?";
    return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");
  }

  // ---------- СПИСОК УЧАЩИХСЯ ----------
  // Простой просмотр всех зарегистрированных пользователей (имя + группа),
  // без возможности начать чат прямо отсюда — для этого есть "+ Новый чат".
  window.openStudentsModal = function() {
    studentsSearchQuery = "";
    const searchInput = document.getElementById("studentsSearchInput");
    if (searchInput) searchInput.value = "";
    renderStudentsList();
    document.getElementById("studentsModal")?.classList.add("show");
  }

  window.closeStudentsModal = function() {
    document.getElementById("studentsModal")?.classList.remove("show");
  }

  window.handleStudentsSearch = function(value) {
    studentsSearchQuery = value;
    renderStudentsList();
  }

  function renderStudentsList() {
    const list = document.getElementById("studentsList");
    if (!list) return;

    const q = studentsSearchQuery.trim().toLowerCase();
    let students = Object.entries(allUsers);

    if (q) {
      students = students.filter(([, data]) => {
        const haystack = [data.name, data.group].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    students.sort((a, b) => (a[1].name || "").localeCompare(b[1].name || ""));

    if (students.length === 0) {
      list.innerHTML = q
        ? '<div class="empty-hint">Никого не найдено по запросу «' + escapeHtml(studentsSearchQuery.trim()) + '».</div>'
        : '<div class="empty-hint">Пока нет зарегистрированных пользователей.</div>';
      return;
    }

    list.innerHTML = "";
    students.forEach(([uid, data]) => {
      const row = document.createElement("div");
      row.className = "plain-user-row";
      const isMe = uid === currentUser.uid;
      row.innerHTML = `
        ${data.photoURL ? `<div class="chat-avatar" style="width:34px;height:34px;flex-shrink:0;"><img src="${data.photoURL}"></div>` : `<div class="chat-avatar" style="width:34px;height:34px;flex-shrink:0;font-size:13px;">${initials(data.name)}</div>`}
        <div class="modal-user-name">${escapeHtml(data.name || "Пользователь")}${isMe ? " (вы)" : ""}${data.group ? ' <span style="color:var(--muted);font-weight:400;">· ' + escapeHtml(data.group) + '</span>' : ''}</div>
      `;
      list.appendChild(row);
    });
  }

  // Раньше это был одноразовый getDocs — из-за этого новые пользователи
  // (например, второй зарегистрированный аккаунт) не появлялись в списке
  // "Новый чат" и в поиске без перезагрузки страницы. Теперь это живая подписка.
  function loadAllUsers() {
    return new Promise((resolve) => {
      let firstLoad = true;
      onSnapshot(collection(db, "users"), (snap) => {
        allUsers = {};
        snap.forEach(d => { allUsers[d.id] = d.data(); });
        if (firstLoad) {
          firstLoad = false;
          resolve();
        }
      });
    });
  }

  // ---------- СПИСОК ЧАТОВ ----------
  function loadChatList() {
    const q = query(
      collection(db, "chats"),
      where("members", "array-contains", currentUser.uid)
    );

    if (chatListUnsub) chatListUnsub();
    chatListUnsub = onSnapshot(q, (snap) => {
      const chats = [];
      snap.forEach(d => {
        const data = d.data();
        if ((data.deletedFor || []).includes(currentUser.uid)) return;
        chats.push({ id: d.id, ...data });
      });

      lastChats = sortChats(chats);
      renderChatList(filterChats(lastChats));
    }, (err) => {
      console.error(err);
      document.getElementById("chatList").innerHTML =
        '<div class="empty-hint">Не получилось загрузить чаты. Проверь подключение.</div>';
    });
  }

  // Глобальный чат всегда сверху; заблокированные (кем бы то ни было —
  // мной или, для личных чатов, собеседником) — всегда внизу списка,
  // но не скрываются, чтобы их можно было явно разблокировать/удалить.
  function sortChats(chats) {
    return [...chats].sort((a, b) => {
      if (a.type === "global") return -1;
      if (b.type === "global") return 1;
      const aBlocked = isChatBlockedForMe(a) ? 1 : 0;
      const bBlocked = isChatBlockedForMe(b) ? 1 : 0;
      if (aBlocked !== bBlocked) return aBlocked - bBlocked;
      return (a.name || "").localeCompare(b.name || "");
    });
  }

  // ---------- ПОИСК ПО ЧАТАМ ----------
  window.handleChatSearch = function(value) {
    chatSearchQuery = value;
    renderChatList(filterChats(lastChats));
  }

  function filterChats(chats) {
    const q = chatSearchQuery.trim().toLowerCase();
    if (!q) return chats;
    return chats.filter(chat => {
      const name = chatDisplayName(chat).toLowerCase();
      const preview = (chat.lastMessage || "").toLowerCase();
      return name.includes(q) || preview.includes(q);
    });
  }

  function chatDisplayName(chat) {
    if (chat.type === "global") return chat.name || "Общий чат";
    if (chat.type === "group") return chat.name || "Группа";
    // личный чат — показываем имя собеседника
    const otherId = (chat.members || []).find(id => id !== currentUser.uid);
    return allUsers[otherId]?.name || "Пользователь";
  }

  function chatHeaderSubText(chat) {
    if (chat.type === "group") return (chat.members?.length || 0) + " участников";
    if (chat.type === "global") return "Все зарегистрированные";
    const otherId = (chat.members || []).find(id => id !== currentUser.uid);
    return allUsers[otherId]?.group || "Личный чат";
  }

  function chatAvatarHTML(chat) {
    if (chat.type === "global") {
      return '<div class="chat-avatar global">◆</div>';
    }
    const name = chatDisplayName(chat);
    if (chat.type === "personal") {
      const otherId = (chat.members || []).find(id => id !== currentUser.uid);
      const photo = allUsers[otherId]?.photoURL;
      if (photo) return `<div class="chat-avatar"><img src="${photo}"></div>`;
    }
    return `<div class="chat-avatar">${initials(name)}</div>`;
  }

  // ---------- БЛОКИРОВКА ЧАТОВ ----------
  // Структура на документе чата:
  //   blockedBy: uid | null — кто заблокировал личный чат (может быть
  //     любая из сторон: инициатор блокировки перестаёт видеть чат как
  //     активный и не может писать; тот, кого заблокировали, тоже не
  //     может писать туда, пока инициатор не разблокирует).
  //   blockedByGroup: [uid, ...] — участники, которые для СЕБЯ заблокировали
  //     групповой чат (уходит вниз списка и сереет только у них лично;
  //     писать в группу такой участник тоже не может, пока не разблокирует).
  //   blockedUsers: [uid, ...] — на групповом чате: пользователи, которых
  //     нельзя добавить в группу заново (устанавливается при блокировке
  //     группы и/или при выходе — см. заметку у leaveGroup).
  function isChatBlockedForMe(chat) {
    if (chat.type === "personal") return !!chat.blockedBy;
    if (chat.type === "group") return (chat.blockedByGroup || []).includes(currentUser.uid);
    return false;
  }

  // Могу ли я сейчас писать в этот чат.
  function canSendToChat(chat) {
    if (!chat) return false;
    if (chat.type === "personal") return !chat.blockedBy;
    if (chat.type === "group") return !(chat.blockedByGroup || []).includes(currentUser.uid);
    return true;
  }

  function renderChatList(chats) {
    const list = document.getElementById("chatList");
    if (chats.length === 0) {
      list.innerHTML = chatSearchQuery.trim()
        ? '<div class="empty-hint">Ничего не найдено по запросу «' + escapeHtml(chatSearchQuery.trim()) + '».</div>'
        : '<div class="empty-hint">Пока нет чатов. Начни новый!</div>';
      return;
    }
    list.innerHTML = "";
    chats.forEach(chat => {
      const blocked = isChatBlockedForMe(chat);
      const item = document.createElement("div");
      item.className = "chat-item"
        + (chat.id === currentChatId ? " active" : "")
        + (blocked ? " blocked" : "");
      item.dataset.chatId = chat.id;
      item.innerHTML = `
        ${chatAvatarHTML(chat)}
        <div class="chat-info">
          <div class="chat-name">${escapeHtml(chatDisplayName(chat))}</div>
          <div class="chat-preview">${escapeHtml(chat.lastMessage || "Нет сообщений")}</div>
        </div>
      `;
      attachChatRowGestures(item, chat);
      list.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // ---------- ЖЕСТЫ НАД СТРОКОЙ ЧАТА (зажатие → панель действий) ----------
  // По короткому тапу — обычное открытие чата. По зажатию — открывается
  // панель "Заблокировать/Разблокировать/Удалить" поверх шапки списка,
  // без перехода в переписку (как и с сообщениями, чтобы не читать чужое
  // сообщение случайно, здесь — чтобы не открыть чат, который хотим просто
  // заблокировать).
  function attachChatRowGestures(row, chat) {
    let moved = false;
    let longPressFired = false;

    const startPress = () => {
      moved = false;
      longPressFired = false;
      clearTimeout(chatRowLongPressTimer);
      chatRowLongPressTimer = setTimeout(() => {
        if (moved) return;
        longPressFired = true;
        openChatActionBar(chat);
        if (navigator.vibrate) navigator.vibrate(15);
      }, CHAT_ROW_LONG_PRESS_MS);
    };

    const cancelPress = () => clearTimeout(chatRowLongPressTimer);

    row.addEventListener("touchstart", startPress, { passive: true });
    row.addEventListener("touchmove", () => { moved = true; cancelPress(); }, { passive: true });
    row.addEventListener("touchend", cancelPress);
    row.addEventListener("touchcancel", cancelPress);

    row.addEventListener("mousedown", startPress);
    row.addEventListener("mousemove", () => { moved = true; });
    row.addEventListener("mouseup", cancelPress);
    row.addEventListener("mouseleave", cancelPress);

    row.addEventListener("click", () => {
      if (longPressFired) { longPressFired = false; return; }
      openChat(chat.id, chat);
    });
  }

  window.openChatActionBar = function(chat) {
    chatActionChatId = chat.id;
    const bar = document.getElementById("chatActionBar");
    const nameEl = document.getElementById("chatActionName");
    const blockBtn = document.getElementById("chatActionBlockBtn");
    if (!bar || !nameEl || !blockBtn) return;

    nameEl.textContent = chatDisplayName(chat);

    const blocked = isChatBlockedForMe(chat);
    blockBtn.title = blocked ? "Разблокировать" : "Заблокировать";
    blockBtn.innerHTML = blocked
      ? '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M8.5 12L11 14.5L15.5 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M5.5 5.5L18.5 18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

    document.querySelectorAll(".chat-item").forEach(el => {
      el.classList.toggle("selected-for-action", el.dataset.chatId === chat.id);
    });

    bar.classList.add("show");
  }

  window.closeChatActionBar = function() {
    chatActionChatId = null;
    document.getElementById("chatActionBar")?.classList.remove("show");
    document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("selected-for-action"));
  }

  function findChatById(chatId) {
    return lastChats.find(c => c.id === chatId) || null;
  }

  // ЗАДЕЛКА ДЫРЫ: раньше "удалить чат у себя" (deletedFor) было
  // необратимо молчаливым — если собеседник (или кто-то из группы) потом
  // писал в этот чат, у удалившего он не появлялся обратно, хотя переписка
  // объективно продолжалась. Теперь при любой новой активности в чате
  // (текст, фото, голосовое) снимаем deletedFor со ВСЕХ участников, кроме
  // отправителя, чтобы чат снова стал видимым как только в нём что-то
  // происходит. Отправитель тоже возвращает себе чат в список неявно —
  // если он писал, значит у него чат явно открыт и не в deletedFor.
  async function reviveChatForOtherMembers(chatId, chatMembers) {
    const others = (chatMembers || []).filter(uid => uid !== currentUser.uid);
    if (others.length === 0) return;
    try {
      await updateDoc(doc(db, "chats", chatId), {
        deletedFor: arrayRemove(...others)
      });
    } catch (err) {
      // Не критично для отправки самого сообщения — просто логируем.
      console.error("Не удалось вернуть чат из удалённых:", err);
    }
  }

  // Личный чат: инициатор блокировки записывается в blockedBy — блокировка
  // держится, пока именно ОН её не снимет (собеседник не может разблокировать
  // чат за него — иначе блокировка была бы бессмысленной).
  // Групповой чат: blockedByGroup — персональный список "заблокировал у себя",
  // каждый управляет только своей записью там.
  // ЗАДЕЛКА ДЫРЫ: раньше blockedByGroup (серый чат/запрет писать у себя) и
  // blockedUsers (запрет админу добавить обратно) были двумя независимыми
  // полями, которые нигде явно не связывались в UI — заблокировав группу
  // тут, человек не защищал себя от повторного добавления, и наоборот.
  // Теперь блокировка группы из этой панели ставит ОБА поля разом, а
  // разблокировка снимает оба — это единое действие с понятным смыслом:
  // "я не хочу быть в этой группе и не хочу, чтобы меня вернули туда
  // без моего ведома". Явно вернуться можно только через разблокировку
  // здесь же, или через отдельный контрол в модалке участников (для
  // случая, когда человек уже вышел, а не просто заблокировал).
  window.toggleChatBlockFromBar = async function() {
    const chat = findChatById(chatActionChatId);
    if (!chat) { closeChatActionBar(); return; }

    try {
      if (chat.type === "personal") {
        if (chat.blockedBy && chat.blockedBy !== currentUser.uid) {
          alert("Этот чат заблокировал собеседник — снять блокировку можете только он.");
          closeChatActionBar();
          return;
        }
        await updateDoc(doc(db, "chats", chat.id), {
          blockedBy: chat.blockedBy ? null : currentUser.uid
        });
      } else if (chat.type === "group") {
        if (isChatBlockedForMe(chat)) {
          await updateDoc(doc(db, "chats", chat.id), {
            blockedByGroup: arrayRemove(currentUser.uid),
            blockedUsers: arrayRemove(currentUser.uid)
          });
        } else {
          await updateDoc(doc(db, "chats", chat.id), {
            blockedByGroup: arrayUnion(currentUser.uid),
            blockedUsers: arrayUnion(currentUser.uid)
          });
        }
      } else {
        alert("Общий чат нельзя заблокировать.");
      }
    } catch (err) {
      alert("Не удалось изменить блокировку: " + err.message);
    }
    closeChatActionBar();
  }

  // Удаление чата у себя: чат перестаёт быть виден в МОЁМ списке (через
  // deletedFor), сами сообщения и чат для остальных участников не
  // затрагиваются. Для группы это равносильно "скрыть у себя" (выйти из
  // группы — отдельное действие в модалке участников, оно ещё и убирает
  // из members, а не только скрывает).
  window.deleteChatFromBar = async function() {
    const chat = findChatById(chatActionChatId);
    if (!chat) { closeChatActionBar(); return; }

    if (chat.type === "global") {
      alert("Общий чат нельзя удалить.");
      closeChatActionBar();
      return;
    }

    const ok = confirm(chat.type === "group"
      ? "Удалить эту группу у себя? Остальные участники продолжат видеть её как обычно."
      : "Удалить этот чат у себя? У собеседника переписка останется.");
    if (!ok) { closeChatActionBar(); return; }

    try {
      await updateDoc(doc(db, "chats", chat.id), {
        deletedFor: arrayUnion(currentUser.uid)
      });
      if (currentChatId === chat.id) closeChat();
    } catch (err) {
      alert("Не удалось удалить чат: " + err.message);
    }
    closeChatActionBar();
  }

  // ---------- УЧАСТНИКИ ГРУППЫ ----------
  // Правила:
  //  - Группой считается чат type === "group" с 3+ участниками
  //    (GROUP_MIN_SIZE) — это же условие, при котором доступна блокировка
  //    "на уровне группы" в смысле задачи (см. leaveGroup ниже).
  //  - Создатель (chat.createdBy) — единственный, кто может ДОБАВЛЯТЬ
  //    участников. Он не может никого исключить.
  //  - Любой участник может сам выйти из группы в любой момент.
  //  - Если участника заблокировали от повторного добавления (см. ниже),
  //    он попадает в chat.blockedUsers и пропадает из списка кандидатов
  //    в модалке "Добавить участников", пока запись явно не снимут.
  //
  // Блокировка группы (chatActionBar → blockedByGroup) и запрет повторного
  // добавления (blockedUsers) теперь ставятся и снимаются вместе одним
  // действием — см. toggleChatBlockFromBar и unblockGroupMember.
  window.openMembersModal = async function(chatId) {
    const chat = findChatById(chatId) || (await getChatDoc(chatId));
    if (!chat || chat.type !== "group") return;

    const modal = document.getElementById("membersModal");
    const list = document.getElementById("membersList");
    const actions = document.getElementById("membersModalActions");
    if (!modal || !list || !actions) return;

    modal.dataset.chatId = chatId;

    renderMembersList(chat);

    actions.innerHTML = "";
    if (chat.createdBy === currentUser.uid) {
      const addBtn = document.createElement("button");
      addBtn.className = "modal-btn confirm";
      addBtn.textContent = "+ Добавить участников";
      addBtn.onclick = () => openAddMembersModal(chatId);
      actions.appendChild(addBtn);
    }
    const leaveBtn = document.createElement("button");
    leaveBtn.className = "modal-btn logout";
    leaveBtn.textContent = "Выйти из группы";
    leaveBtn.onclick = () => leaveGroup(chatId);
    actions.appendChild(leaveBtn);

    const closeBtn = document.createElement("button");
    closeBtn.className = "modal-btn cancel";
    closeBtn.textContent = "Закрыть";
    closeBtn.onclick = closeMembersModal;
    actions.appendChild(closeBtn);

    modal.classList.add("show");
  }

  async function getChatDoc(chatId) {
    const snap = await getDoc(doc(db, "chats", chatId));
    return snap.exists() ? { id: chatId, ...snap.data() } : null;
  }

  function renderMembersList(chat) {
    const list = document.getElementById("membersList");
    if (!list) return;
    const members = chat.members || [];
    const blockedUsers = chat.blockedUsers || [];
    const isAdmin = chat.createdBy === currentUser.uid;

    list.innerHTML = "";
    members.forEach(uid => {
      const u = allUsers[uid] || {};
      const row = document.createElement("div");
      row.className = "plain-user-row";
      const isCreator = uid === chat.createdBy;
      const isMe = uid === currentUser.uid;
      row.innerHTML = `
        <div class="modal-user-name">${escapeHtml(u.name || u.email || "Пользователь")}${isMe ? " (вы)" : ""}${u.group ? ' <span style="color:var(--muted);font-weight:400;">· ' + escapeHtml(u.group) + '</span>' : ''}</div>
        ${isCreator ? '<span class="role-badge">Админ</span>' : ''}
      `;
      list.appendChild(row);
    });

    // ЗАДЕЛКА ДЫРЫ: раньше снять запись из blockedUsers (заблокировал себя
    // сам / вышел из группы) можно было только вручную в базе — здесь
    // единственный человек, кто в принципе может это увидеть (админ,
    // потому что у самого заблокированного/вышедшего участника чат уже не
    // отображается в его списке — он не в members), получает контрол,
    // чтобы явно вернуть человеку возможность быть добавленным снова.
    if (isAdmin && blockedUsers.length > 0) {
      const header = document.createElement("div");
      header.className = "empty-hint";
      header.style.textAlign = "left";
      header.style.padding = "14px 8px 4px 8px";
      header.textContent = "Заблокированы (нельзя добавить, пока не снимете блокировку):";
      list.appendChild(header);

      blockedUsers.forEach(uid => {
        const u = allUsers[uid] || {};
        const row = document.createElement("div");
        row.className = "plain-user-row";
        row.style.opacity = "0.7";
        row.innerHTML = `
          <div class="modal-user-name">${escapeHtml(u.name || u.email || "Пользователь")}${u.group ? ' <span style="color:var(--muted);font-weight:400;">· ' + escapeHtml(u.group) + '</span>' : ''}</div>
        `;
        const unblockBtn = document.createElement("button");
        unblockBtn.className = "row-leave-btn";
        unblockBtn.textContent = "Разблокировать";
        unblockBtn.onclick = () => unblockGroupMember(chat.id, uid);
        row.appendChild(unblockBtn);
        list.appendChild(row);
      });
    }
  }

  // Снимает запись из blockedUsers (и, если она там ещё осталась, из
  // blockedByGroup — на случай если человек когда-то заблокировал группу
  // для себя, но потом чат под него подчистили другим путём). Доступно
  // только через модалку участников, которую видит админ.
  window.unblockGroupMember = async function(chatId, uid) {
    try {
      await updateDoc(doc(db, "chats", chatId), {
        blockedUsers: arrayRemove(uid),
        blockedByGroup: arrayRemove(uid)
      });
      const chat = await getChatDoc(chatId);
      if (chat) renderMembersList(chat);
    } catch (err) {
      alert("Не удалось снять блокировку: " + err.message);
    }
  }

  window.closeMembersModal = function() {
    document.getElementById("membersModal")?.classList.remove("show");
  }

  // Выход из группы: убираю себя из members. Заодно фиксирую себя в
  // blockedUsers — по условию задачи, если группу заблокировали (в данном
  // случае трактуем "вышел из группы" как то же самое, что "заблокировал
  // для себя навсегда"), админ не должен иметь возможность добавить этого
  // человека обратно без явного снятия блокировки.
  window.leaveGroup = async function(chatId) {
    const chat = findChatById(chatId) || (await getChatDoc(chatId));
    if (!chat) return;

    const ok = confirm("Выйти из группы «" + (chat.name || "Группа") + "»? Обратно тебя сможет добавить только админ группы, и только после того, как явно снимет блокировку в списке участников.");
    if (!ok) return;

    try {
      await updateDoc(doc(db, "chats", chatId), {
        members: arrayRemove(currentUser.uid),
        blockedUsers: arrayUnion(currentUser.uid)
      });
      closeMembersModal();
      if (currentChatId === chatId) closeChat();
    } catch (err) {
      alert("Не удалось выйти из группы: " + err.message);
    }
  }

  // ---------- ДОБАВЛЕНИЕ УЧАСТНИКОВ В ГРУППУ (только админ) ----------
  window.openAddMembersModal = async function(chatId) {
    const chat = findChatById(chatId) || (await getChatDoc(chatId));
    if (!chat) return;
    if (chat.createdBy !== currentUser.uid) {
      alert("Добавлять участников может только создатель группы.");
      return;
    }

    addMembersChatId = chatId;
    selectedNewMemberIds = new Set();
    addMembersSearchQuery = "";
    const searchInput = document.getElementById("addMembersSearchInput");
    if (searchInput) searchInput.value = "";
    document.getElementById("addMembersConfirmBtn").disabled = true;

    renderAddMembersList(chat);
    document.getElementById("addMembersModal").classList.add("show");
  }

  window.handleAddMembersSearch = function(value) {
    addMembersSearchQuery = value;
    const chat = findChatById(addMembersChatId);
    if (chat) renderAddMembersList(chat);
  }

  function renderAddMembersList(chat) {
    const list = document.getElementById("addMembersList");
    if (!list) return;

    const members = new Set(chat.members || []);
    const blockedUsers = new Set(chat.blockedUsers || []);
    const q = addMembersSearchQuery.trim().toLowerCase();

    let candidates = Object.entries(allUsers).filter(([uid]) => !members.has(uid));

    // Заблокированных (в т.ч. тех, кто ранее сам вышел из группы) —
    // исключаем из списка кандидатов: их нельзя добавить обратно, пока
    // блокировка явно не снята.
    const blockedCandidates = candidates.filter(([uid]) => blockedUsers.has(uid));
    candidates = candidates.filter(([uid]) => !blockedUsers.has(uid));

    if (q) {
      candidates = candidates.filter(([, data]) => {
        const haystack = [data.name, data.group, data.email].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    list.innerHTML = "";

    if (candidates.length === 0 && blockedCandidates.length === 0) {
      list.innerHTML = '<div class="empty-hint">Добавлять больше некого.</div>';
      return;
    }

    candidates.forEach(([uid, data]) => {
      const row = document.createElement("label");
      row.className = "modal-user";
      row.innerHTML = `
        <input type="checkbox" data-uid="${uid}">
        <div class="modal-user-name">${escapeHtml(data.name || data.email)}${data.group ? ' <span style="color:var(--muted);font-weight:400;">· ' + escapeHtml(data.group) + '</span>' : ''}</div>
      `;
      const checkbox = row.querySelector("input");
      checkbox.checked = selectedNewMemberIds.has(uid);
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) selectedNewMemberIds.add(uid);
        else selectedNewMemberIds.delete(uid);
        document.getElementById("addMembersConfirmBtn").disabled = selectedNewMemberIds.size === 0;
      });
      list.appendChild(row);
    });

    // ЗАДЕЛКА ДЫРЫ: раньше заблокированные просто показывались серым без
    // возможности что-либо с этим сделать здесь же — админу приходилось
    // закрывать эту модалку, открывать модалку участников, искать там
    // того же человека и только потом возвращаться сюда. Кнопка ниже
    // снимает блокировку сразу на месте и перерисовывает список, так что
    // человек тут же попадает в обычные кандидаты с чекбоксом.
    if (blockedCandidates.length > 0 && !q) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.style.textAlign = "left";
      hint.style.padding = "10px 8px 4px 8px";
      hint.textContent = "Нельзя добавить (покинули группу или заблокированы):";
      list.appendChild(hint);
      blockedCandidates.forEach(([uid, data]) => {
        const row = document.createElement("div");
        row.className = "plain-user-row";
        row.style.opacity = "0.7";
        row.innerHTML = `<div class="modal-user-name">${escapeHtml(data.name || data.email)}</div>`;
        const unblockBtn = document.createElement("button");
        unblockBtn.className = "row-leave-btn";
        unblockBtn.textContent = "Разблокировать";
        unblockBtn.onclick = async () => {
          await unblockGroupMember(chat.id, uid);
          const freshChat = await getChatDoc(chat.id);
          if (freshChat) renderAddMembersList(freshChat);
        };
        row.appendChild(unblockBtn);
        list.appendChild(row);
      });
    }
  }

  window.closeAddMembersModal = function() {
    document.getElementById("addMembersModal")?.classList.remove("show");
  }

  window.confirmAddMembers = async function() {
    if (selectedNewMemberIds.size === 0 || !addMembersChatId) return;
    try {
      await updateDoc(doc(db, "chats", addMembersChatId), {
        members: arrayUnion(...Array.from(selectedNewMemberIds))
      });
      closeAddMembersModal();
      const chat = await getChatDoc(addMembersChatId);
      if (chat) renderMembersList(chat);
    } catch (err) {
      alert("Не удалось добавить участников: " + err.message);
    }
  }

  // ---------- ОТКРЫТИЕ ЧАТА ----------
  window.openChat = async function(chatId, chatData) {
    currentChatId = chatId;
    replyingTo = null;
    selectionMode = false;
    selectedMessageIds = new Set();
    if (deleteWindowRefreshInterval) { clearInterval(deleteWindowRefreshInterval); deleteWindowRefreshInterval = null; }
    document.getElementById("app").classList.add("chat-open");

    document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));

    const isGroup = chatData.type === "group";
    const blocked = !canSendToChat(chatData);

    const main = document.getElementById("main");
    main.innerHTML = `
      <div id="chatHeader">
        <button id="backBtn" onclick="closeChat()">‹</button>
        <div style="flex:1;min-width:0;">
          <div id="chatHeaderName">${escapeHtml(chatDisplayName(chatData))}</div>
          <div id="chatHeaderSub">${chatHeaderSubText(chatData)}</div>
        </div>
        ${isGroup ? `
        <button class="icon-btn" title="Участники группы" onclick="openMembersModal('${chatId}')" style="width:36px;height:36px;">
          <svg viewBox="0 0 24 24" fill="none"><path d="M17 21V19C17 16.79 15.21 15 13 15H5C2.79 15 1 16.79 1 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/><path d="M23 21V19C23 17.13 21.73 15.51 20 15.03" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 3.13C17.72 3.58 19 5.19 19 7C19 8.81 17.72 10.42 16 10.87" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>` : ``}
      </div>
      <div id="selectionBar">
        <button class="sel-close" onclick="exitSelectionMode()" title="Отменить">×</button>
        <div class="sel-count" id="selCount">1</div>
        <button class="sel-action" id="selReplyBtn" onclick="replySelectedMessage()" title="Ответить">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 14L4 9L9 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9H14.5C18.09 9 21 11.91 21 15.5V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="sel-action danger" onclick="deleteSelectedMessages()" title="Удалить">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 7V4H15V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 7L7 20H17L18 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="messages"></div>
      <div id="replyPreview">
        <div class="reply-bar"></div>
        <div class="reply-info">
          <div class="reply-info-name" id="replyPreviewName"></div>
          <div class="reply-info-text" id="replyPreviewText"></div>
        </div>
        <button class="reply-cancel" onclick="cancelReply()" title="Отменить ответ">×</button>
      </div>
      ${blocked ? `
      <div id="composer" style="justify-content:center;">
        <div style="color:var(--muted);font-size:13.5px;text-align:center;padding:6px 0;">
          🔒 Чат заблокирован — отправка сообщений недоступна
        </div>
      </div>
      ` : `
      <div id="composer">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить фото">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 15V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="2"/><path d="M3 17L8 12L11 15L16 10L21 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 3V9M15 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div id="recordingBar">
          <div class="rec-dot"></div>
          <span id="recTimer">0:00</span>
          <button class="rec-cancel" onclick="cancelRecording()">Отмена</button>
        </div>

        <textarea id="msgInput" placeholder="Написать сообщение…" rows="1"></textarea>

        <button class="icon-btn" id="micBtn" onclick="toggleRecording()" title="Голосовое сообщение">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15C13.66 15 15 13.66 15 12V6C15 4.34 13.66 3 12 3C10.34 3 9 4.34 9 6V12C9 13.66 10.34 15 12 15Z" stroke="currentColor" stroke-width="2"/><path d="M19 11V12C19 15.87 15.87 19 12 19C8.13 19 5 15.87 5 12V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <button id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L14 21L11 13L3 11Z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
      `}
    `;

    document.getElementById("fileInput").onchange = handleFileSelected;

    const input = document.getElementById("msgInput");
    if (input) {
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
        updateComposerButtons();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      updateComposerButtons();
    }

    listenToMessages(chatId);
    lastChats = await currentChatsSnapshotFallback();
    renderChatList(filterChats(lastChats));
  }

  // Небольшой helper: перерисовать список с подсветкой активного чата,
  // используя последние загруженные данные (не делаем лишний запрос).
  async function currentChatsSnapshotFallback() {
    const q = query(collection(db, "chats"), where("members", "array-contains", currentUser.uid));
    const snap = await getDocs(q);
    const chats = [];
    snap.forEach(d => {
      const data = d.data();
      if ((data.deletedFor || []).includes(currentUser.uid)) return;
      chats.push({ id: d.id, ...data });
    });
    return sortChats(chats);
  }

  window.closeChat = function() {
    document.getElementById("app").classList.remove("chat-open");
  }

  function listenToMessages(chatId) {
    if (unsubscribeMessages) unsubscribeMessages();
    openMenuMessageId = null;
    lastRenderedMessages = {};

    const q = query(
      collection(db, "chats", chatId, "messages"),
      orderBy("createdAt", "asc"),
      limit(200)
    );

    unsubscribeMessages = onSnapshot(q, (snap) => {
      const box = document.getElementById("messages");
      if (!box) return;
      box.innerHTML = "";
      let lastSender = null;
      lastRenderedMessages = {};

      snap.forEach(d => {
        const msg = d.data();
        const msgId = d.id;

        // Сообщение "удалено у себя" тем, кто его удалил — не показываем
        // его вообще (для остальных участников оно остаётся видимым как обычно).
        if ((msg.deletedFor || []).includes(currentUser.uid)) return;

        lastRenderedMessages[msgId] = msg;
        const isMe = msg.senderId === currentUser.uid;
        const row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "me" : "them");
        row.dataset.id = msgId;

        let senderLabel = "";
        if (!isMe && msg.senderId !== lastSender) {
          senderLabel = `<div class="msg-sender">${escapeHtml(allUsers[msg.senderId]?.name || "Пользователь")}</div>`;
        }
        lastSender = msg.senderId;

        const time = msg.createdAt?.toDate ? formatTime(msg.createdAt.toDate()) : "";

        row.appendChild(renderBubble(msg, msgId, senderLabel, time, isMe));
        if (selectionMode && selectedMessageIds.has(msgId)) row.classList.add("selected");
        attachRowGestures(row, msgId);
        box.appendChild(row);
      });

      if (selectionMode) document.getElementById("messages").classList.add("selection-mode");
      box.scrollTop = box.scrollHeight;
    });

    if (deleteWindowRefreshInterval) clearInterval(deleteWindowRefreshInterval);
    deleteWindowRefreshInterval = setInterval(() => {
      // Просто перерисовываем текущий список сообщений из уже загруженных
      // данных — это уберёт кнопку "Удалить" у сообщений, которым
      // исполнилось 10 минут, без лишнего запроса к Firestore.
      const box = document.getElementById("messages");
      if (!box || !currentChatId) return;
      const anyOld = Object.values(lastRenderedMessages).some(
        m => m.senderId === currentUser.uid && !messageIsWithinDeleteWindow(m)
      );
      if (anyOld) rerenderMessagesFromCache();
    }, 30000);
  }

  function rerenderMessagesFromCache() {
    const box = document.getElementById("messages");
    if (!box) return;
    const scrollBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = "";
    let lastSender = null;
    Object.entries(lastRenderedMessages).forEach(([msgId, msg]) => {
      const isMe = msg.senderId === currentUser.uid;
      const row = document.createElement("div");
      row.className = "msg-row " + (isMe ? "me" : "them");
      row.dataset.id = msgId;

      let senderLabel = "";
      if (!isMe && msg.senderId !== lastSender) {
        senderLabel = `<div class="msg-sender">${escapeHtml(allUsers[msg.senderId]?.name || "Пользователь")}</div>`;
      }
      lastSender = msg.senderId;

      const time = msg.createdAt?.toDate ? formatTime(msg.createdAt.toDate()) : "";
      row.appendChild(renderBubble(msg, msgId, senderLabel, time, isMe));
      if (selectionMode && selectedMessageIds.has(msgId)) row.classList.add("selected");
      attachRowGestures(row, msgId);
      box.appendChild(row);
    });
    box.classList.toggle("selection-mode", selectionMode);
    if (scrollBottom) box.scrollTop = box.scrollHeight;
  }

  // Короткий превью-текст сообщения любого типа — используется и в цитате
  // ответа внутри пузыря, и в плашке "отвечаю на..." над полем ввода.
  function messagePreviewText(msg) {
    if (msg.type === "image") return "📷 Фото";
    if (msg.type === "voice") return "🎤 Голосовое сообщение";
    return msg.text || "";
  }

  function renderReplyQuoteHTML(msg) {
    if (!msg.replyTo) return "";
    const name = escapeHtml(msg.replyTo.senderName || "Пользователь");
    const text = escapeHtml(msg.replyTo.text || "");
    return `<div class="msg-reply-quote" onclick="event.stopPropagation(); scrollToMessage('${msg.replyTo.id}')">
      <span class="reply-name">${name}</span>
      <span class="reply-text">${text}</span>
    </div>`;
  }

  function renderBubble(msg, msgId, senderLabelHTML, time, isMe) {
    const replyQuoteHTML = renderReplyQuoteHTML(msg);

    const checkHTML = `
      <div class="msg-select-check" onclick="event.stopPropagation(); toggleMessageSelected('${msgId}')">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    `;

    let innerHTML;
    if (msg.type === "image") {
      innerHTML = `
        ${senderLabelHTML}
        <div class="msg-bubble-wrap">
          ${replyQuoteHTML}
          <img class="bubble-image" src="${msg.mediaUrl}" draggable="false" onclick="event.stopPropagation(); handleBubbleTap('${msgId}', () => openLightbox('${msg.mediaUrl}'))">
        </div>
        <div class="msg-time">${time}</div>
      `;
    } else if (msg.type === "voice") {
      const dur = msg.duration ? formatDuration(msg.duration) : "0:00";
      innerHTML = `
        ${senderLabelHTML}
        <div class="msg-bubble-wrap">
          <div class="voice-bubble" data-url="${msg.mediaUrl}">
            ${replyQuoteHTML}
            <button class="voice-play-btn" onclick="event.stopPropagation(); handleBubbleTap('${msgId}', () => toggleVoicePlay(this))">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5V19L19 12L8 5Z"/></svg>
            </button>
            <div class="voice-track"><div class="voice-track-fill"></div></div>
            <div class="voice-duration">${dur}</div>
          </div>
        </div>
        <div class="msg-time">${time}</div>
      `;
    } else {
      innerHTML = `
        ${senderLabelHTML}
        <div class="msg-bubble-wrap">
          <div class="bubble">${replyQuoteHTML}${escapeHtml(msg.text)}</div>
        </div>
        <div class="msg-time">${time}</div>
      `;
    }

    const inner = document.createElement("div");
    inner.className = "msg-row-inner";
    inner.innerHTML = innerHTML;

    const frag = document.createDocumentFragment();
    if (isMe) {
      frag.appendChild(inner);
      const checkWrap = document.createElement("div");
      checkWrap.innerHTML = checkHTML;
      frag.appendChild(checkWrap.firstElementChild);
    } else {
      const checkWrap = document.createElement("div");
      checkWrap.innerHTML = checkHTML;
      frag.appendChild(checkWrap.firstElementChild);
      frag.appendChild(inner);
    }
    return frag;
  }

  // ---------- ВЫДЕЛЕНИЕ / ОТВЕТ / УДАЛЕНИЕ СООБЩЕНИЙ ----------
  // Правила:
  //  - Зажатие (long-press) на сообщении (текст или голосовое/фото) включает
  //    режим множественного выделения — как в WhatsApp/Telegram. В этом режиме
  //    обычный тап по любому сообщению просто отмечает/снимает отметку.
  //  - Пока выделено ровно одно сообщение — в шапке доступна кнопка "Ответить".
  //    Как только выделено 2+ — доступно только удаление.
  //  - Чужое сообщение удаляется ТОЛЬКО у себя (с подтверждением).
  //  - Своё сообщение в первые 10 минут после отправки можно удалить у всех
  //    или только у себя. После 10 минут — только у себя (с явным предупреждением
  //    о том, что "у всех" больше не сработает).
  const DELETE_WINDOW_MS = 10 * 60 * 1000; // 10 минут

  function messageIsWithinDeleteWindow(msg) {
    if (!msg.createdAt?.toDate) return false; // ещё не подтверждено сервером — на всякий случай не даём удалить "у всех"
    return (Date.now() - msg.createdAt.toDate().getTime()) < DELETE_WINDOW_MS;
  }

  const LONG_PRESS_MS = 450;

  // Вешаем обработчики зажатия/тапа на ВСЮ строку сообщения (row), а не
  // только на пузырь — так зажатие срабатывает по всей ширине чата, даже
  // если палец/курсор оказался сбоку от текста, в пустом месте строки.
  function attachRowGestures(row, msgId) {
    let moved = false;

    const startPress = () => {
      moved = false;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (moved) return;
        longPressTriggeredId = msgId;
        enterSelectionMode(msgId);
        if (navigator.vibrate) navigator.vibrate(15);
      }, LONG_PRESS_MS);
    };

    const cancelPress = () => {
      clearTimeout(longPressTimer);
    };

    row.addEventListener("touchstart", startPress, { passive: true });
    row.addEventListener("touchmove", () => { moved = true; cancelPress(); }, { passive: true });
    row.addEventListener("touchend", cancelPress);
    row.addEventListener("touchcancel", cancelPress);

    row.addEventListener("mousedown", startPress);
    row.addEventListener("mousemove", () => { moved = true; });
    row.addEventListener("mouseup", cancelPress);
    row.addEventListener("mouseleave", cancelPress);

    row.addEventListener("click", () => {
      // Если клик пришёл сразу после сработавшего long-press на ЭТОМ ЖЕ
      // сообщении — это тот самый press, а не отдельный тап; игнорируем,
      // чтобы не снять только что поставленную отметку.
      if (longPressTriggeredId === msgId) {
        longPressTriggeredId = null;
        return;
      }
      if (selectionMode) {
        toggleMessageSelected(msgId);
      } else {
        handleBubbleTap(msgId, null);
      }
    });
  }

  // Обычный (короткий) тап по сообщению вне режима выделения:
  // для фото/голосовых внутренний элемент уже сам решает, что делать
  // (открыть лайтбокс, включить проигрывание) — прокидываем действие сюда;
  // просто текстовые сообщения по одиночному тапу ничего не делают.
  window.handleBubbleTap = function(msgId, action) {
    if (selectionMode) {
      toggleMessageSelected(msgId);
      return;
    }
    if (typeof action === "function") action();
  }

  function enterSelectionMode(initialMsgId) {
    selectionMode = true;
    selectedMessageIds = new Set([initialMsgId]);
    document.getElementById("messages")?.classList.add("selection-mode");
    document.getElementById("selectionBar")?.classList.add("show");
    updateSelectionRowClasses();
    updateSelectionBar();
  }

  window.exitSelectionMode = function() {
    selectionMode = false;
    selectedMessageIds = new Set();
    document.getElementById("messages")?.classList.remove("selection-mode");
    document.getElementById("selectionBar")?.classList.remove("show");
    updateSelectionRowClasses();
  }

  window.toggleMessageSelected = function(msgId) {
    if (!selectionMode) {
      enterSelectionMode(msgId);
      return;
    }
    if (selectedMessageIds.has(msgId)) {
      selectedMessageIds.delete(msgId);
    } else {
      selectedMessageIds.add(msgId);
    }
    if (selectedMessageIds.size === 0) {
      exitSelectionMode();
      return;
    }
    updateSelectionRowClasses();
    updateSelectionBar();
  }

  function updateSelectionRowClasses() {
    document.querySelectorAll(".msg-row").forEach(row => {
      row.classList.toggle("selected", selectedMessageIds.has(row.dataset.id));
    });
  }

  function updateSelectionBar() {
    const count = selectedMessageIds.size;
    const countEl = document.getElementById("selCount");
    const replyBtn = document.getElementById("selReplyBtn");
    if (countEl) countEl.textContent = String(count);
    if (replyBtn) replyBtn.style.display = count === 1 ? "flex" : "none";
  }

  window.replySelectedMessage = function() {
    if (selectedMessageIds.size !== 1) return;
    const msgId = Array.from(selectedMessageIds)[0];
    exitSelectionMode();
    startReply(msgId);
  }

  function startReply(msgId) {
    const msg = lastRenderedMessages[msgId];
    if (!msg) return;

    const isMe = msg.senderId === currentUser.uid;
    const senderName = isMe ? "Вы" : (allUsers[msg.senderId]?.name || "Пользователь");

    replyingTo = {
      id: msgId,
      text: messagePreviewText(msg),
      senderName,
      type: msg.type || "text"
    };

    showReplyPreview();
    const input = document.getElementById("msgInput");
    if (input) input.focus();
  }

  window.cancelReply = function() {
    replyingTo = null;
    const preview = document.getElementById("replyPreview");
    if (preview) preview.classList.remove("show");
  }

  function showReplyPreview() {
    if (!replyingTo) return;
    const preview = document.getElementById("replyPreview");
    const nameEl = document.getElementById("replyPreviewName");
    const textEl = document.getElementById("replyPreviewText");
    if (!preview || !nameEl || !textEl) return;
    nameEl.textContent = replyingTo.senderName;
    textEl.textContent = replyingTo.text;
    preview.classList.add("show");
  }

  window.scrollToMessage = function(msgId) {
    const row = document.querySelector(`.msg-row[data-id="${msgId}"]`);
    if (!row) return;
    row.scrollIntoView({ behavior: "smooth", block: "center" });
    row.style.transition = "background-color 0.3s ease";
    const bubble = row.querySelector(".bubble, .voice-bubble, .bubble-image");
    if (bubble) {
      const original = bubble.style.filter;
      bubble.style.filter = "brightness(0.85)";
      setTimeout(() => { bubble.style.filter = original; }, 400);
    }
  }

  // ---------- УДАЛЕНИЕ ----------
  // Точка входа из панели множественного выделения.
  window.deleteSelectedMessages = function() {
    if (selectedMessageIds.size === 0) return;
    const ids = Array.from(selectedMessageIds);
    openDeleteModal(ids);
  }

  // Открывает модалку подтверждения удаления и решает, какие кнопки показать,
  // в зависимости от состава выделенных сообщений:
  //  - если ВСЕ выделенные — свои и ВСЕ ещё в пределах 10 минут → показываем
  //    "Удалить у всех" и "Удалить у себя";
  //  - если есть хотя бы одно чужое или просроченное своё → доступно только
  //    "Удалить у себя" (для просроченных — с объяснением про 10 минут).
  function openDeleteModal(ids) {
    const msgs = ids.map(id => ({ id, msg: lastRenderedMessages[id] })).filter(x => x.msg);
    if (msgs.length === 0) return;

    const allMine = msgs.every(x => x.msg.senderId === currentUser.uid);
    const allWithinWindow = msgs.every(x => messageIsWithinDeleteWindow(x.msg));
    const anyMineExpired = msgs.some(x => x.msg.senderId === currentUser.uid && !messageIsWithinDeleteWindow(x.msg));

    const title = document.getElementById("deleteModalTitle");
    const text = document.getElementById("deleteModalText");
    const actions = document.getElementById("deleteModalActions");
    if (!title || !text || !actions) return;

    const count = msgs.length;
    const plural = count === 1 ? "сообщение" : "сообщения";

    actions.innerHTML = "";

    if (allMine && allWithinWindow) {
      title.textContent = count === 1 ? "Удалить сообщение?" : `Удалить ${count} ${plural}?`;
      text.textContent = "";

      const btnAll = document.createElement("button");
      btnAll.className = "modal-btn confirm";
      btnAll.style.background = "var(--error, #c0392b)";
      btnAll.textContent = "Удалить у всех";
      btnAll.onclick = () => confirmDelete(ids, "everyone");

      const btnMe = document.createElement("button");
      btnMe.className = "modal-btn confirm";
      btnMe.textContent = "Удалить у себя";
      btnMe.onclick = () => confirmDelete(ids, "me");

      const btnCancel = document.createElement("button");
      btnCancel.className = "modal-btn cancel";
      btnCancel.textContent = "Отмена";
      btnCancel.onclick = closeDeleteModal;

      actions.appendChild(btnAll);
      actions.appendChild(btnMe);
      actions.appendChild(btnCancel);
    } else {
      title.textContent = count === 1 ? "Вы хотите удалить сообщение у себя?" : `Удалить ${count} ${plural} у себя?`;
      text.textContent = anyMineExpired || (allMine && !allWithinWindow)
        ? "Прошло 10 минут, после этого времени сообщение не возможно удалить у всех."
        : "Сообщение будет удалено только в вашей переписке — у остальных участников оно останется.";

      const btnMe = document.createElement("button");
      btnMe.className = "modal-btn confirm";
      btnMe.textContent = "Удалить у себя";
      btnMe.onclick = () => confirmDelete(ids, "me");

      const btnCancel = document.createElement("button");
      btnCancel.className = "modal-btn cancel";
      btnCancel.textContent = "Отмена";
      btnCancel.onclick = closeDeleteModal;

      actions.appendChild(btnMe);
      actions.appendChild(btnCancel);
    }

    document.getElementById("deleteModal").classList.add("show");
  }

  function closeDeleteModal() {
    document.getElementById("deleteModal").classList.remove("show");
  }

  // mode: "everyone" — физическое удаление документа сообщения (доступно только
  // для своих сообщений в пределах 10 минут — этот путь заблокирован в openDeleteModal
  // при других условиях);
  // mode: "me" — сообщение остаётся в базе, но в поле deletedFor добавляется
  // мой uid, из-за чего оно перестаёт показываться только в моей ленте.
  async function confirmDelete(ids, mode) {
    closeDeleteModal();
    exitSelectionMode();

    try {
      for (const msgId of ids) {
        const msg = lastRenderedMessages[msgId];
        if (!msg) continue;

        if (mode === "everyone") {
          if (msg.senderId !== currentUser.uid || !messageIsWithinDeleteWindow(msg)) continue; // подстраховка
          await deleteDoc(doc(db, "chats", currentChatId, "messages", msgId));
        } else {
          await updateDoc(doc(db, "chats", currentChatId, "messages", msgId), {
            deletedFor: arrayUnion(currentUser.uid)
          });
        }

        if (replyingTo && replyingTo.id === msgId) cancelReply();
      }
    } catch (err) {
      alert("Не удалось удалить сообщение: " + err.message);
    }
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  // ---------- ВОСПРОИЗВЕДЕНИЕ ГОЛОСОВЫХ ----------
  let currentAudio = null;
  let currentAudioBtn = null;

  window.toggleVoicePlay = function(btn) {
    const bubble = btn.closest(".voice-bubble");
    const url = bubble.dataset.url;
    const fill = bubble.querySelector(".voice-track-fill");

    if (currentAudio && currentAudioBtn === btn) {
      if (currentAudio.paused) {
        currentAudio.play();
        setPlayIcon(btn, true);
      } else {
        currentAudio.pause();
        setPlayIcon(btn, false);
      }
      return;
    }

    if (currentAudio) {
      currentAudio.pause();
      setPlayIcon(currentAudioBtn, false);
    }

    currentAudio = new Audio(url);
    currentAudioBtn = btn;
    setPlayIcon(btn, true);

    currentAudio.addEventListener("timeupdate", () => {
      if (currentAudio.duration) {
        fill.style.width = (currentAudio.currentTime / currentAudio.duration * 100) + "%";
      }
    });
    currentAudio.addEventListener("ended", () => {
      setPlayIcon(btn, false);
      fill.style.width = "0%";
    });

    currentAudio.play();
  }

  function setPlayIcon(btn, playing) {
    btn.innerHTML = playing
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5V19L19 12L8 5Z"/></svg>';
  }

  // ---------- ЛАЙТБОКС ----------
  window.openLightbox = function(url) {
    document.getElementById("lightboxImg").src = url;
    document.getElementById("lightbox").classList.add("show");
  }
  window.closeLightbox = function() {
    document.getElementById("lightbox").classList.remove("show");
  }

  // Показываем кнопку отправки, если в поле есть хоть один символ,
  // иначе показываем кнопку записи голосового — они занимают одно и то же место.
  function updateComposerButtons() {
    const input = document.getElementById("msgInput");
    const micBtn = document.getElementById("micBtn");
    const sendBtn = document.getElementById("sendBtn");
    if (!input || !micBtn || !sendBtn) return;

    const hasText = input.value.trim().length > 0;
    micBtn.style.display = hasText ? "none" : "flex";
    sendBtn.style.display = hasText ? "flex" : "none";
  }

  function formatTime(date) {
    return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  window.sendMessage = async function() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text || !currentChatId) return;

    const chat = findChatById(currentChatId);
    if (chat && !canSendToChat(chat)) {
      alert("Нельзя отправить сообщение — чат заблокирован.");
      return;
    }

    // Если сейчас отвечаем на сообщение — прикладываем компактную ссылку
    // на него (id + имя автора + короткий превью текста). Полный документ
    // оригинала не дублируем, чтобы не раздувать сообщение.
    const replySnapshot = replyingTo
      ? { id: replyingTo.id, text: replyingTo.text, senderName: replyingTo.senderName }
      : null;

    input.value = "";
    input.style.height = "auto";
    cancelReply();
    updateComposerButtons();

    try {
      const payload = {
        text,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
      };
      if (replySnapshot) payload.replyTo = replySnapshot;

      await addDoc(collection(db, "chats", currentChatId, "messages"), payload);
      await setDoc(doc(db, "chats", currentChatId), {
        lastMessage: text,
        lastMessageAt: serverTimestamp()
      }, { merge: true });
      await reviveChatForOtherMembers(currentChatId, chat?.members);
    } catch (err) {
      alert("Не удалось отправить сообщение: " + err.message);
    }
  }

  // ---------- НОВЫЙ ЧАТ (личный или групповой) ----------
  window.openNewChatModal = function() {
    selectedUserIds = new Set();
    isGroupMode = false;
    userSearchQuery = "";
    document.getElementById("modalTitle").textContent = "Новый чат";
    document.getElementById("groupNameInput").style.display = "none";
    document.getElementById("createChatBtn").disabled = true;
    document.getElementById("createChatBtn").textContent = "Создать";

    const searchInput = document.getElementById("userSearchInput");
    if (searchInput) searchInput.value = "";

    renderUserPickerList();
    document.getElementById("newChatModal").classList.add("show");
  }

  window.handleUserSearch = function(value) {
    userSearchQuery = value;
    renderUserPickerList();
  }

  function renderUserPickerList() {
    const list = document.getElementById("userPickerList");
    list.innerHTML = "";

    const q = userSearchQuery.trim().toLowerCase();
    let others = Object.entries(allUsers).filter(([uid]) => uid !== currentUser.uid);

    if (q) {
      others = others.filter(([, data]) => {
        const haystack = [data.name, data.group, data.email].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    if (others.length === 0) {
      list.innerHTML = q
        ? '<div class="empty-hint">Никого не найдено по запросу «' + escapeHtml(userSearchQuery.trim()) + '».</div>'
        : '<div class="empty-hint">Пока нет других зарегистрированных пользователей.</div>';
      return;
    }

    others.forEach(([uid, data]) => {
      const row = document.createElement("label");
      row.className = "modal-user";
      row.innerHTML = `
        <input type="checkbox" data-uid="${uid}">
        <div class="modal-user-name">${escapeHtml(data.name || data.email)}${data.group ? ' <span style="color:var(--muted);font-weight:400;">· ' + escapeHtml(data.group) + '</span>' : ''}</div>
      `;
      const checkbox = row.querySelector("input");
      checkbox.checked = selectedUserIds.has(uid);
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) selectedUserIds.add(uid);
        else selectedUserIds.delete(uid);

        isGroupMode = selectedUserIds.size > 1;
        document.getElementById("groupNameInput").style.display = isGroupMode ? "block" : "none";
        document.getElementById("createChatBtn").disabled = selectedUserIds.size === 0;
        document.getElementById("createChatBtn").textContent = isGroupMode ? "Создать группу" : "Создать чат";
      });
      list.appendChild(row);
    });
  }

  window.closeNewChatModal = function() {
    document.getElementById("newChatModal").classList.remove("show");
  }

  window.createSelectedChat = async function() {
    if (selectedUserIds.size === 0) return;
    const ids = Array.from(selectedUserIds);

    // Личный чат 1-на-1 с самим собой запрещён (заметки себе не поддерживаются).
    // Групповой чат — другая история: там просто нельзя выбрать себя как
    // "дополнительного" участника (список и так исключает свой uid), поэтому
    // единственный сценарий self-переписки, который нужно перекрыть — это
    // персональный чат, где единственный выбранный uid совпадает с моим.
    if (!isGroupMode && ids.length === 1 && ids[0] === currentUser.uid) {
      alert("Нельзя создать чат с самим собой.");
      return;
    }

    const members = [currentUser.uid, ...ids];

    try {
      if (isGroupMode) {
        const groupName = document.getElementById("groupNameInput").value.trim() || "Новая группа";
        const ref = await addDoc(collection(db, "chats"), {
          type: "group",
          name: groupName,
          members,
          createdAt: serverTimestamp(),
          createdBy: currentUser.uid
        });
        closeNewChatModal();
        const snap = await getDoc(ref);
        openChat(ref.id, { id: ref.id, ...snap.data() });
      } else {
        // Личный чат — проверяем, нет ли уже такого.
        // members записываем в ТОМ ЖЕ отсортированном порядке, что и id
        // документа — это требуют новые правила Firestore и это же
        // исключает появление "второго" чата для той же пары людей.
        const otherId = ids[0];
        const sortedMembers = [currentUser.uid, otherId].sort();
        const existingId = sortedMembers.join("_");
        const existingRef = doc(db, "chats", existingId);
        const existingSnap = await getDoc(existingRef);

        if (!existingSnap.exists()) {
          await setDoc(existingRef, {
            type: "personal",
            members: sortedMembers,
            createdAt: serverTimestamp()
          });
        }
        closeNewChatModal();
        const snap = await getDoc(existingRef);
        openChat(existingId, { id: existingId, ...snap.data() });
      }
    } catch (err) {
      alert("Не удалось создать чат: " + err.message);
    }
  }

  // ---------- ЗАГРУЗКА ФОТО ----------
  window.handleFileSelected = async function(e) {
    const file = e.target.files[0];
    e.target.value = ""; // сброс, чтобы можно было выбрать тот же файл повторно
    if (!file || !currentChatId) return;

    const chatForFile = findChatById(currentChatId);
    if (chatForFile && !canSendToChat(chatForFile)) {
      alert("Нельзя отправить фото — чат заблокирован.");
      return;
    }

    if (!file.type.startsWith("image/")) {
      alert("Пока можно отправлять только изображения.");
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      alert("Файл слишком большой (максимум 15 МБ).");
      return;
    }

    const box = document.getElementById("messages");
    const placeholder = document.createElement("div");
    placeholder.className = "msg-row me";
    placeholder.innerHTML = '<div class="upload-progress">Загружаем фото…</div>';
    if (box) { box.appendChild(placeholder); box.scrollTop = box.scrollHeight; }

    try {
      const url = await uploadToCloudinary(file, CLOUDINARY_IMAGE_URL);
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        type: "image",
        mediaUrl: url,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
      });
      await setDoc(doc(db, "chats", currentChatId), {
        lastMessage: "📷 Фото",
        lastMessageAt: serverTimestamp()
      }, { merge: true });
      await reviveChatForOtherMembers(currentChatId, chatForFile?.members);
    } catch (err) {
      alert("Не удалось загрузить фото: " + err.message);
    } finally {
      placeholder.remove();
    }
  }

  async function uploadToCloudinary(blobOrFile, endpoint) {
    const formData = new FormData();
    formData.append("file", blobOrFile);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const res = await fetch(endpoint, { method: "POST", body: formData });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error("Cloudinary: " + errText);
    }
    const data = await res.json();
    return data.secure_url;
  }

  // ---------- ЗАПИСЬ ГОЛОСОВЫХ СООБЩЕНИЙ ----------
  window.toggleRecording = async function() {
    if (isRecording) {
      stopRecordingAndSend();
    } else {
      startRecording();
    }
  }

  async function startRecording() {
    if (!currentChatId) return;

    const chatForVoice = findChatById(currentChatId);
    if (chatForVoice && !canSendToChat(chatForVoice)) {
      alert("Нельзя отправить голосовое — чат заблокирован.");
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      alert("Не удалось получить доступ к микрофону. Разреши доступ в настройках браузера.");
      return;
    }

    recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    isRecording = true;
    recordingStartTime = Date.now();

    document.getElementById("micBtn").classList.add("recording");
    document.getElementById("recordingBar").classList.add("show");
    document.getElementById("msgInput").style.display = "none";

    recordingTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
      const timerEl = document.getElementById("recTimer");
      if (timerEl) timerEl.textContent = formatDuration(secs);

      if (secs >= 120) { // ограничение 2 минуты на голосовое
        stopRecordingAndSend();
      }
    }, 250);
  }

  function resetRecordingUI() {
    isRecording = false;
    clearInterval(recordingTimerInterval);
    const micBtn = document.getElementById("micBtn");
    const bar = document.getElementById("recordingBar");
    const input = document.getElementById("msgInput");
    if (micBtn) micBtn.classList.remove("recording");
    if (bar) bar.classList.remove("show");
    if (input) input.style.display = "";
    updateComposerButtons();
  }

  window.cancelRecording = function() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.onstop = (function(origHandler) {
        return function() {
          origHandler();
          recordedChunks = [];
        };
      })(mediaRecorder.onstop);
      mediaRecorder.stop();
    }
    resetRecordingUI();
  }

  function stopRecordingAndSend() {
    if (!mediaRecorder || mediaRecorder.state === "inactive") return;

    const durationSecs = (Date.now() - recordingStartTime) / 1000;
    const chatForVoiceSend = findChatById(currentChatId);

    mediaRecorder.onstop = async () => {
      mediaRecorder.stream?.getTracks?.().forEach(t => t.stop());

      if (recordedChunks.length === 0 || durationSecs < 0.5) {
        resetRecordingUI();
        return;
      }

      const blob = new Blob(recordedChunks, { type: "audio/webm" });
      resetRecordingUI();

      const box = document.getElementById("messages");
      const placeholder = document.createElement("div");
      placeholder.className = "msg-row me";
      placeholder.innerHTML = '<div class="upload-progress">Отправляем голосовое…</div>';
      if (box) { box.appendChild(placeholder); box.scrollTop = box.scrollHeight; }

      try {
        // Раньше файл всегда назывался "voice.webm" — при определённых настройках
        // upload_preset в Cloudinary это приводило к перезаписи предыдущего
        // голосового новым (или переиспользованию старого URL), из-за чего
        // все голосовые сообщения в итоге проигрывали один и тот же звук.
        // Уникальное имя на каждую запись решает проблему.
        const uniqueName = `voice_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.webm`;
        const file = new File([blob], uniqueName, { type: "audio/webm" });
        const url = await uploadToCloudinary(file, CLOUDINARY_AUDIO_URL);
        await addDoc(collection(db, "chats", currentChatId, "messages"), {
          type: "voice",
          mediaUrl: url,
          duration: Math.round(durationSecs),
          senderId: currentUser.uid,
          createdAt: serverTimestamp()
        });
        await setDoc(doc(db, "chats", currentChatId), {
          lastMessage: "🎤 Голосовое сообщение",
          lastMessageAt: serverTimestamp()
        }, { merge: true });
        await reviveChatForOtherMembers(currentChatId, chatForVoiceSend?.members);
      } catch (err) {
        alert("Не удалось отправить голосовое: " + err.message);
      } finally {
        placeholder.remove();
      }
    };

    mediaRecorder.stop();
  }

</script>
