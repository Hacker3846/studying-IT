<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Мессенджер</title>

<style>
  :root {
    --ink: #1a1d1f;
    --paper: #f6f4ef;
    --card: #ffffff;
    --accent: #3454d1;
    --accent-dark: #2540a8;
    --line: #e2ded3;
    --muted: #8a8578;
    --bubble-me: #3454d1;
    --bubble-them: #ffffff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
  }

  /* ===== СПИСОК ЧАТОВ ===== */
  #sidebar {
    width: 100%;
    max-width: 340px;
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  #sidebarHeader {
    padding: 16px 18px 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .mark-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--accent);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .mark-text {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  #meBtn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #newChatBtn {
    margin: 12px 18px;
    padding: 10px 0;
    background: var(--paper);
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  #newChatBtn:hover { border-color: var(--accent); color: var(--accent); }

  #chatList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 12px 8px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 10px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 2px;
  }

  .chat-item:hover { background: var(--paper); }
  .chat-item.active { background: #eaf0fb; }

  .chat-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    flex-shrink: 0;
    overflow: hidden;
  }

  .chat-avatar.global { background: var(--accent); color: white; }
  .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .chat-info { flex: 1; min-width: 0; }

  .chat-name {
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-preview {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .empty-hint {
    padding: 24px 18px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 1.5;
  }

  /* ===== ОКНО ПЕРЕПИСКИ ===== */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--paper);
  }

  #chatHeader {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    flex-shrink: 0;
  }

  #backBtn {
    display: none;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink);
    padding: 0 4px 0 0;
  }

  #chatHeaderName { font-weight: 700; font-size: 15.5px; }
  #chatHeaderSub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .msg-row {
    display: flex;
    max-width: 78%;
    margin-bottom: 4px;
  }

  .msg-row.me { align-self: flex-end; flex-direction: column; align-items: flex-end; }
  .msg-row.them { align-self: flex-start; flex-direction: column; align-items: flex-start; }

  .msg-sender {
    font-size: 11.5px;
    color: var(--accent);
    font-weight: 600;
    margin: 6px 4px 3px 4px;
  }

  .bubble {
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg-row.them .bubble {
    background: var(--bubble-them);
    color: var(--ink);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .msg-time {
    font-size: 10.5px;
    color: var(--muted);
    margin: 3px 4px 0 4px;
  }

  /* ===== МЕДИА В СООБЩЕНИЯХ ===== */
  .bubble-media {
    padding: 0;
    overflow: hidden;
    background: transparent;
    border: none;
  }

  .bubble-image {
    max-width: 260px;
    max-height: 320px;
    display: block;
    border-radius: 16px;
    cursor: pointer;
  }

  .msg-row.me .bubble-image { border-bottom-right-radius: 4px; }
  .msg-row.them .bubble-image { border-bottom-left-radius: 4px; border: 1px solid var(--line); }

  .voice-bubble {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px 9px 10px;
    border-radius: 16px;
    min-width: 180px;
  }

  .msg-row.me .voice-bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .msg-row.them .voice-bubble { background: var(--bubble-them); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

  .voice-play-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.25);
    color: inherit;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .msg-row.them .voice-play-btn { background: var(--paper); }
  .voice-play-btn svg { width: 13px; height: 13px; }

  .voice-track {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    position: relative;
  }

  .msg-row.them .voice-track { background: var(--line); }

  .voice-track-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: currentColor;
    border-radius: 2px;
  }

  .voice-duration {
    font-size: 11px;
    opacity: 0.85;
    flex-shrink: 0;
    min-width: 30px;
  }

  .upload-progress {
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bubble-them);
    border: 1px solid var(--line);
  }

  .msg-row.me .upload-progress { border-bottom-right-radius: 4px; }
  .msg-row.them .upload-progress { border-bottom-left-radius: 4px; }

  #composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--card);
    flex-shrink: 0;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--paper);
    border: none;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:hover { background: var(--line); color: var(--ink); }
  .icon-btn svg { width: 19px; height: 19px; }

  .icon-btn.recording {
    background: #c0392b;
    color: white;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  #recordingBar {
    display: none;
    align-items: center;
    gap: 10px;
    flex: 1;
    padding: 10px 16px;
    background: #fbeae8;
    border-radius: 20px;
    font-size: 13.5px;
    color: var(--error, #c0392b);
    font-weight: 600;
  }

  #recordingBar.show { display: flex; }
  #recordingBar .rec-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #c0392b;
    animation: pulse 1s ease-in-out infinite;
    flex-shrink: 0;
  }
  #recordingBar .rec-cancel {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  #msgInput {
    flex: 1;
    resize: none;
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    max-height: 120px;
    line-height: 1.4;
  }

  #msgInput:focus { border-color: var(--accent); }

  #sendBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #sendBtn:disabled { opacity: 0.4; cursor: default; }
  #sendBtn svg { width: 18px; height: 18px; }

  #emptyState {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  /* ===== МОДАЛКИ ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,29,31,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    width: 100%;
    max-width: 360px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .modal h3 { margin: 0 0 14px 0; font-size: 17px; }

  .modal-list {
    overflow-y: auto;
    flex: 1;
    margin: 0 -8px;
    padding: 0 8px;
  }

  .modal-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-radius: 10px;
    cursor: pointer;
  }

  .modal-user:hover { background: var(--paper); }

  .modal-user input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }

  .modal-user-name { font-size: 14px; font-weight: 500; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .modal-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }

  .modal-btn.cancel { background: var(--paper); color: var(--ink); }
  .modal-btn.confirm { background: var(--accent); color: white; }
  .modal-btn.confirm:disabled { opacity: 0.5; cursor: default; }

  #groupNameInput {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
  }
  #groupNameInput:focus { border-color: var(--accent); }

  /* ===== ЛАЙТБОКС ФОТО ===== */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #lightboxClose {
    position: absolute;
    top: 20px; right: 20px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
  }

  /* ===== МОБИЛЬНАЯ ВЁРСТКА ===== */
  @media (max-width: 760px) {
    #sidebar { max-width: 100%; }
    #app.chat-open #sidebar { display: none; }
    #app:not(.chat-open) #main { display: none; }
    #backBtn { display: block; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- СПИСОК ЧАТОВ -->
  <div id="sidebar">
    <div id="sidebarHeader">
      <div class="mark">
        <div class="mark-dot"></div>
        <div class="mark-text">Мессенджер</div>
      </div>
      <button id="meBtn" title="Выйти" onclick="handleLogout()">·</button>
    </div>
    <button id="newChatBtn" onclick="openNewChatModal()">+ Новый чат</button>
    <div id="chatList">
      <div class="empty-hint">Загружаем чаты…</div>
    </div>
  </div>

  <!-- ОКНО ПЕРЕПИСКИ -->
  <div id="main">
    <div id="emptyState">Выбери чат слева, чтобы начать переписку</div>
  </div>

</div>

<!-- ЛАЙТБОКС ДЛЯ ФОТО -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightboxClose">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<!-- МОДАЛКА: НОВЫЙ ЧАТ -->
<div class="modal-overlay" id="newChatModal">
  <div class="modal">
    <h3 id="modalTitle">Новый чат</h3>
    <input type="text" id="groupNameInput" placeholder="Название группы" style="display:none;">
    <div class="modal-list" id="userPickerList"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeNewChatModal()">Отмена</button>
      <button class="modal-btn confirm" id="createChatBtn" onclick="createSelectedChat()" disabled>Создать</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    addDoc,
    setDoc,
    getDoc,
    getDocs,
    serverTimestamp,
    limit
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBnHrPE4dLu1Hl_1wxm7nL9Iu2ZSty5hBY",
    authDomain: "messenjer8uchilisha.firebaseapp.com",
    projectId: "messenjer8uchilisha",
    storageBucket: "messenjer8uchilisha.firebasestorage.app",
    messagingSenderId: "323729368567",
    appId: "1:323729368567:web:67fff7eb9a659d55917af2",
    measurementId: "G-V3REH3FXTF"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let allUsers = {};           // uid -> {name, email, photoURL}
  let currentChatId = null;
  let unsubscribeMessages = null;
  let chatListUnsub = null;
  let selectedUserIds = new Set();
  let isGroupMode = false;

  // ---------- CLOUDINARY (хранение фото и голосовых) ----------
  const CLOUDINARY_CLOUD_NAME = "ctcszg0j";
  const CLOUDINARY_UPLOAD_PRESET = "ml_default";
  const CLOUDINARY_IMAGE_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
  const CLOUDINARY_AUDIO_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`; // аудио грузится через /video/

  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingStartTime = null;
  let recordingTimerInterval = null;
  let isRecording = false;

  // ---------- АВТОРИЗАЦИЯ ----------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    currentUser = user;
    const snap = await getDoc(doc(db, "users", user.uid));
    currentUserData = snap.exists() ? snap.data() : { name: user.email };
    document.getElementById("meBtn").textContent = initials(currentUserData.name);
    document.getElementById("meBtn").title = currentUserData.name + " — нажми, чтобы выйти";

    await loadAllUsers();
    loadChatList();
  });

  window.handleLogout = function() {
    if (confirm("Выйти из аккаунта?")) {
      signOut(auth);
    }
  }

  function initials(name) {
    if (!name) return "?";
    return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");
  }

  async function loadAllUsers() {
    const snap = await getDocs(collection(db, "users"));
    snap.forEach(d => { allUsers[d.id] = d.data(); });
  }

  // ---------- СПИСОК ЧАТОВ ----------
  function loadChatList() {
    const q = query(
      collection(db, "chats"),
      where("members", "array-contains", currentUser.uid)
    );

    if (chatListUnsub) chatListUnsub();
    chatListUnsub = onSnapshot(q, (snap) => {
      const chats = [];
      snap.forEach(d => chats.push({ id: d.id, ...d.data() }));

      // Глобальный чат всегда сверху, дальше по алфавиту/типу
      chats.sort((a, b) => {
        if (a.type === "global") return -1;
        if (b.type === "global") return 1;
        return (a.name || "").localeCompare(b.name || "");
      });

      renderChatList(chats);
    }, (err) => {
      console.error(err);
      document.getElementById("chatList").innerHTML =
        '<div class="empty-hint">Не получилось загрузить чаты. Проверь подключение.</div>';
    });
  }

  function chatDisplayName(chat) {
    if (chat.type === "global") return chat.name || "Общий чат";
    if (chat.type === "group") return chat.name || "Группа";
    // личный чат — показываем имя собеседника
    const otherId = (chat.members || []).find(id => id !== currentUser.uid);
    return allUsers[otherId]?.name || "Пользователь";
  }

  function chatAvatarHTML(chat) {
    if (chat.type === "global") {
      return '<div class="chat-avatar global">◆</div>';
    }
    const name = chatDisplayName(chat);
    if (chat.type === "personal") {
      const otherId = (chat.members || []).find(id => id !== currentUser.uid);
      const photo = allUsers[otherId]?.photoURL;
      if (photo) return `<div class="chat-avatar"><img src="${photo}"></div>`;
    }
    return `<div class="chat-avatar">${initials(name)}</div>`;
  }

  function renderChatList(chats) {
    const list = document.getElementById("chatList");
    if (chats.length === 0) {
      list.innerHTML = '<div class="empty-hint">Пока нет чатов. Начни новый!</div>';
      return;
    }
    list.innerHTML = "";
    chats.forEach(chat => {
      const item = document.createElement("div");
      item.className = "chat-item" + (chat.id === currentChatId ? " active" : "");
      item.onclick = () => openChat(chat.id, chat);
      item.innerHTML = `
        ${chatAvatarHTML(chat)}
        <div class="chat-info">
          <div class="chat-name">${escapeHtml(chatDisplayName(chat))}</div>
          <div class="chat-preview">${escapeHtml(chat.lastMessage || "Нет сообщений")}</div>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // ---------- ОТКРЫТИЕ ЧАТА ----------
  window.openChat = async function(chatId, chatData) {
    currentChatId = chatId;
    document.getElementById("app").classList.add("chat-open");

    document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));

    const main = document.getElementById("main");
    main.innerHTML = `
      <div id="chatHeader">
        <button id="backBtn" onclick="closeChat()">‹</button>
        <div>
          <div id="chatHeaderName">${escapeHtml(chatDisplayName(chatData))}</div>
          <div id="chatHeaderSub">${chatData.type === "group" ? (chatData.members?.length || 0) + " участников" : chatData.type === "global" ? "Все зарегистрированные" : "Личный чат"}</div>
        </div>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить фото">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 15V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="2"/><path d="M3 17L8 12L11 15L16 10L21 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 3V9M15 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div id="recordingBar">
          <div class="rec-dot"></div>
          <span id="recTimer">0:00</span>
          <button class="rec-cancel" onclick="cancelRecording()">Отмена</button>
        </div>

        <textarea id="msgInput" placeholder="Написать сообщение…" rows="1"></textarea>

        <button class="icon-btn" id="micBtn" onclick="toggleRecording()" title="Голосовое сообщение">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15C13.66 15 15 13.66 15 12V6C15 4.34 13.66 3 12 3C10.34 3 9 4.34 9 6V12C9 13.66 10.34 15 12 15Z" stroke="currentColor" stroke-width="2"/><path d="M19 11V12C19 15.87 15.87 19 12 19C8.13 19 5 15.87 5 12V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <button id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L14 21L11 13L3 11Z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    `;

    document.getElementById("fileInput").onchange = handleFileSelected;

    const input = document.getElementById("msgInput");
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    listenToMessages(chatId);
    renderChatList(await currentChatsSnapshotFallback());
  }

  // Небольшой helper: перерисовать список с подсветкой активного чата,
  // используя последние загруженные данные (не делаем лишний запрос).
  async function currentChatsSnapshotFallback() {
    const q = query(collection(db, "chats"), where("members", "array-contains", currentUser.uid));
    const snap = await getDocs(q);
    const chats = [];
    snap.forEach(d => chats.push({ id: d.id, ...d.data() }));
    chats.sort((a, b) => {
      if (a.type === "global") return -1;
      if (b.type === "global") return 1;
      return (a.name || "").localeCompare(b.name || "");
    });
    return chats;
  }

  window.closeChat = function() {
    document.getElementById("app").classList.remove("chat-open");
  }

  function listenToMessages(chatId) {
    if (unsubscribeMessages) unsubscribeMessages();

    const q = query(
      collection(db, "chats", chatId, "messages"),
      orderBy("createdAt", "asc"),
      limit(200)
    );

    unsubscribeMessages = onSnapshot(q, (snap) => {
      const box = document.getElementById("messages");
      if (!box) return;
      box.innerHTML = "";
      let lastSender = null;

      snap.forEach(d => {
        const msg = d.data();
        const isMe = msg.senderId === currentUser.uid;
        const row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "me" : "them");

        let senderLabel = "";
        if (!isMe && msg.senderId !== lastSender) {
          senderLabel = `<div class="msg-sender">${escapeHtml(allUsers[msg.senderId]?.name || "Пользователь")}</div>`;
        }
        lastSender = msg.senderId;

        const time = msg.createdAt?.toDate ? formatTime(msg.createdAt.toDate()) : "";

        row.appendChild(renderBubble(msg, senderLabel, time));
        box.appendChild(row);
      });

      box.scrollTop = box.scrollHeight;
    });
  }

  function renderBubble(msg, senderLabelHTML, time) {
    const wrap = document.createElement("div");

    if (msg.type === "image") {
      wrap.innerHTML = `
        ${senderLabelHTML}
        <img class="bubble-image" src="${msg.mediaUrl}" onclick="openLightbox('${msg.mediaUrl}')">
        <div class="msg-time">${time}</div>
      `;
    } else if (msg.type === "voice") {
      const dur = msg.duration ? formatDuration(msg.duration) : "0:00";
      wrap.innerHTML = `
        ${senderLabelHTML}
        <div class="voice-bubble" data-url="${msg.mediaUrl}">
          <button class="voice-play-btn" onclick="toggleVoicePlay(this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5V19L19 12L8 5Z"/></svg>
          </button>
          <div class="voice-track"><div class="voice-track-fill"></div></div>
          <div class="voice-duration">${dur}</div>
        </div>
        <div class="msg-time">${time}</div>
      `;
    } else {
      wrap.innerHTML = `
        ${senderLabelHTML}
        <div class="bubble">${escapeHtml(msg.text)}</div>
        <div class="msg-time">${time}</div>
      `;
    }
    return wrap;
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  // ---------- ВОСПРОИЗВЕДЕНИЕ ГОЛОСОВЫХ ----------
  let currentAudio = null;
  let currentAudioBtn = null;

  window.toggleVoicePlay = function(btn) {
    const bubble = btn.closest(".voice-bubble");
    const url = bubble.dataset.url;
    const fill = bubble.querySelector(".voice-track-fill");

    if (currentAudio && currentAudioBtn === btn) {
      if (currentAudio.paused) {
        currentAudio.play();
        setPlayIcon(btn, true);
      } else {
        currentAudio.pause();
        setPlayIcon(btn, false);
      }
      return;
    }

    if (currentAudio) {
      currentAudio.pause();
      setPlayIcon(currentAudioBtn, false);
    }

    currentAudio = new Audio(url);
    currentAudioBtn = btn;
    setPlayIcon(btn, true);

    currentAudio.addEventListener("timeupdate", () => {
      if (currentAudio.duration) {
        fill.style.width = (currentAudio.currentTime / currentAudio.duration * 100) + "%";
      }
    });
    currentAudio.addEventListener("ended", () => {
      setPlayIcon(btn, false);
      fill.style.width = "0%";
    });

    currentAudio.play();
  }

  function setPlayIcon(btn, playing) {
    btn.innerHTML = playing
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5V19L19 12L8 5Z"/></svg>';
  }

  // ---------- ЛАЙТБОКС ----------
  window.openLightbox = function(url) {
    document.getElementById("lightboxImg").src = url;
    document.getElementById("lightbox").classList.add("show");
  }
  window.closeLightbox = function() {
    document.getElementById("lightbox").classList.remove("show");
  }

  function formatTime(date) {
    return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  window.sendMessage = async function() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text || !currentChatId) return;

    input.value = "";
    input.style.height = "auto";

    try {
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        text,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
      });
      await setDoc(doc(db, "chats", currentChatId), {
        lastMessage: text,
        lastMessageAt: serverTimestamp()
      }, { merge: true });
    } catch (err) {
      alert("Не удалось отправить сообщение: " + err.message);
    }
  }

  // ---------- НОВЫЙ ЧАТ (личный или групповой) ----------
  window.openNewChatModal = function() {
    selectedUserIds = new Set();
    isGroupMode = false;
    document.getElementById("modalTitle").textContent = "Новый чат";
    document.getElementById("groupNameInput").style.display = "none";
    document.getElementById("createChatBtn").disabled = true;
    document.getElementById("createChatBtn").textContent = "Создать";

    const list = document.getElementById("userPickerList");
    list.innerHTML = "";

    const others = Object.entries(allUsers).filter(([uid]) => uid !== currentUser.uid);

    if (others.length === 0) {
      list.innerHTML = '<div class="empty-hint">Пока нет других зарегистрированных пользователей.</div>';
    }

    others.forEach(([uid, data]) => {
      const row = document.createElement("label");
      row.className = "modal-user";
      row.innerHTML = `
        <input type="checkbox" data-uid="${uid}">
        <div class="modal-user-name">${escapeHtml(data.name || data.email)}</div>
      `;
      const checkbox = row.querySelector("input");
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) selectedUserIds.add(uid);
        else selectedUserIds.delete(uid);

        isGroupMode = selectedUserIds.size > 1;
        document.getElementById("groupNameInput").style.display = isGroupMode ? "block" : "none";
        document.getElementById("createChatBtn").disabled = selectedUserIds.size === 0;
        document.getElementById("createChatBtn").textContent = isGroupMode ? "Создать группу" : "Создать чат";
      });
      list.appendChild(row);
    });

    document.getElementById("newChatModal").classList.add("show");
  }

  window.closeNewChatModal = function() {
    document.getElementById("newChatModal").classList.remove("show");
  }

  window.createSelectedChat = async function() {
    if (selectedUserIds.size === 0) return;
    const ids = Array.from(selectedUserIds);
    const members = [currentUser.uid, ...ids];

    try {
      if (isGroupMode) {
        const groupName = document.getElementById("groupNameInput").value.trim() || "Новая группа";
        const ref = await addDoc(collection(db, "chats"), {
          type: "group",
          name: groupName,
          members,
          createdAt: serverTimestamp(),
          createdBy: currentUser.uid
        });
        closeNewChatModal();
        const snap = await getDoc(ref);
        openChat(ref.id, { id: ref.id, ...snap.data() });
      } else {
        // Личный чат — проверяем, нет ли уже такого
        const otherId = ids[0];
        const existingId = [currentUser.uid, otherId].sort().join("_");
        const existingRef = doc(db, "chats", existingId);
        const existingSnap = await getDoc(existingRef);

        if (!existingSnap.exists()) {
          await setDoc(existingRef, {
            type: "personal",
            members: [currentUser.uid, otherId],
            createdAt: serverTimestamp()
          });
        }
        closeNewChatModal();
        const snap = await getDoc(existingRef);
        openChat(existingId, { id: existingId, ...snap.data() });
      }
    } catch (err) {
      alert("Не удалось создать чат: " + err.message);
    }
  }

  // ---------- ЗАГРУЗКА ФОТО ----------
  window.handleFileSelected = async function(e) {
    const file = e.target.files[0];
    e.target.value = ""; // сброс, чтобы можно было выбрать тот же файл повторно
    if (!file || !currentChatId) return;

    if (!file.type.startsWith("image/")) {
      alert("Пока можно отправлять только изображения.");
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      alert("Файл слишком большой (максимум 15 МБ).");
      return;
    }

    const box = document.getElementById("messages");
    const placeholder = document.createElement("div");
    placeholder.className = "msg-row me";
    placeholder.innerHTML = '<div class="upload-progress">Загружаем фото…</div>';
    if (box) { box.appendChild(placeholder); box.scrollTop = box.scrollHeight; }

    try {
      const url = await uploadToCloudinary(file, CLOUDINARY_IMAGE_URL);
      await addDoc(collection(db, "chats", currentChatId, "messages"), {
        type: "image",
        mediaUrl: url,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
      });
      await setDoc(doc(db, "chats", currentChatId), {
        lastMessage: "📷 Фото",
        lastMessageAt: serverTimestamp()
      }, { merge: true });
    } catch (err) {
      alert("Не удалось загрузить фото: " + err.message);
    } finally {
      placeholder.remove();
    }
  }

  async function uploadToCloudinary(blobOrFile, endpoint) {
    const formData = new FormData();
    formData.append("file", blobOrFile);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const res = await fetch(endpoint, { method: "POST", body: formData });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error("Cloudinary: " + errText);
    }
    const data = await res.json();
    return data.secure_url;
  }

  // ---------- ЗАПИСЬ ГОЛОСОВЫХ СООБЩЕНИЙ ----------
  window.toggleRecording = async function() {
    if (isRecording) {
      stopRecordingAndSend();
    } else {
      startRecording();
    }
  }

  async function startRecording() {
    if (!currentChatId) return;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      alert("Не удалось получить доступ к микрофону. Разреши доступ в настройках браузера.");
      return;
    }

    recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    isRecording = true;
    recordingStartTime = Date.now();

    document.getElementById("micBtn").classList.add("recording");
    document.getElementById("recordingBar").classList.add("show");
    document.getElementById("msgInput").style.display = "none";

    recordingTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
      const timerEl = document.getElementById("recTimer");
      if (timerEl) timerEl.textContent = formatDuration(secs);

      if (secs >= 120) { // ограничение 2 минуты на голосовое
        stopRecordingAndSend();
      }
    }, 250);
  }

  function resetRecordingUI() {
    isRecording = false;
    clearInterval(recordingTimerInterval);
    const micBtn = document.getElementById("micBtn");
    const bar = document.getElementById("recordingBar");
    const input = document.getElementById("msgInput");
    if (micBtn) micBtn.classList.remove("recording");
    if (bar) bar.classList.remove("show");
    if (input) input.style.display = "";
  }

  window.cancelRecording = function() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.onstop = (function(origHandler) {
        return function() {
          origHandler();
          recordedChunks = [];
        };
      })(mediaRecorder.onstop);
      mediaRecorder.stop();
    }
    resetRecordingUI();
  }

  function stopRecordingAndSend() {
    if (!mediaRecorder || mediaRecorder.state === "inactive") return;

    const durationSecs = (Date.now() - recordingStartTime) / 1000;

    mediaRecorder.onstop = async () => {
      mediaRecorder.stream?.getTracks?.().forEach(t => t.stop());

      if (recordedChunks.length === 0 || durationSecs < 0.5) {
        resetRecordingUI();
        return;
      }

      const blob = new Blob(recordedChunks, { type: "audio/webm" });
      resetRecordingUI();

      const box = document.getElementById("messages");
      const placeholder = document.createElement("div");
      placeholder.className = "msg-row me";
      placeholder.innerHTML = '<div class="upload-progress">Отправляем голосовое…</div>';
      if (box) { box.appendChild(placeholder); box.scrollTop = box.scrollHeight; }

      try {
        const file = new File([blob], "voice.webm", { type: "audio/webm" });
        const url = await uploadToCloudinary(file, CLOUDINARY_AUDIO_URL);
        await addDoc(collection(db, "chats", currentChatId, "messages"), {
          type: "voice",
          mediaUrl: url,
          duration: Math.round(durationSecs),
          senderId: currentUser.uid,
          createdAt: serverTimestamp()
        });
        await setDoc(doc(db, "chats", currentChatId), {
          lastMessage: "🎤 Голосовое сообщение",
          lastMessageAt: serverTimestamp()
        }, { merge: true });
      } catch (err) {
        alert("Не удалось отправить голосовое: " + err.message);
      } finally {
        placeholder.remove();
      }
    };

    mediaRecorder.stop();
  }

</script>
